<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Card — habit tracker</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#161A19">
<meta name="description" content="A private daily habit tracker.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Card">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#161A19;
  --stock:#D8D4C3;
  --stock-2:#E5E2D4;
  --ink:#1C211F;
  --ink-2:#4B534E;
  --ink-3:#7C837D;
  --rule:rgba(28,33,31,.16);
  --rule-2:rgba(28,33,31,.30);
  --mimeo:#4A3D8F;
  --hi:#4A3D8F;
  --radius:3px;
  --pad:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--desk);
  background-image:
    radial-gradient(circle at 20% 0%, rgba(74,61,143,.18), transparent 55%),
    radial-gradient(circle at 95% 100%, rgba(23,96,92,.14), transparent 50%);
  color:var(--ink);
  font-family:'Archivo',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:26px 16px 60px;
  display:flex;justify-content:center;
}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--mimeo);outline-offset:2px}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}

.shell{width:100%;max-width:620px}

/* ---------- the card ---------- */
.card{
  position:relative;
  background:var(--stock);
  background-image:linear-gradient(178deg,var(--stock-2),var(--stock) 40%);
  border-radius:var(--radius);
  box-shadow:0 18px 44px rgba(0,0,0,.45), 0 2px 0 rgba(255,255,255,.22) inset;
  padding:0 0 8px;
  overflow:hidden;
}
.card::before,.card::after{
  content:'';position:absolute;left:0;right:0;height:9px;pointer-events:none;z-index:3;
  background-image:radial-gradient(circle at 7px 0, var(--desk) 3.6px, transparent 4.1px);
  background-size:14px 9px;
}
.card::before{top:0}
.card::after{bottom:0;transform:rotate(180deg)}

/* ---------- masthead ---------- */
.mast{padding:26px var(--pad) 16px;border-bottom:1px solid var(--rule-2);position:relative}
.mast .serial{
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--ink-3);display:flex;justify-content:space-between;
}
.mast h1{
  font-size:clamp(30px,8.5vw,46px);font-weight:800;letter-spacing:-.035em;
  line-height:.95;margin:10px 0 2px;
}
.mast .sub{font-family:'DM Mono',monospace;font-size:12px;color:var(--ink-2);letter-spacing:.04em}

.tally{display:flex;align-items:center;gap:12px;margin-top:18px}
.tally .count{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.pips{display:flex;gap:6px;flex-wrap:wrap}
.pip{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--rule-2)}
.pip.on{border-color:transparent;background:var(--desk);box-shadow:inset 0 1px 2px rgba(0,0,0,.9)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;padding:12px var(--pad) 0}
.tab{
  flex:1;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  padding:9px 4px;color:var(--ink-3);border-bottom:2px solid transparent;text-align:center;
}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--mimeo)}
.tab:hover{color:var(--ink)}

.view{padding:6px var(--pad) 22px}

.lab{
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--ink-3);margin:22px 0 8px;display:flex;align-items:center;gap:10px;
}
.lab::after{content:'';flex:1;height:1px;background:var(--rule)}

/* ---------- today rows ---------- */
.row{
  display:flex;align-items:center;gap:14px;padding:14px 0;
  border-bottom:1px dotted var(--rule-2);
}
.row:last-child{border-bottom:0}
.row .glyph{
  width:34px;height:34px;flex:none;border-radius:2px;display:grid;place-items:center;
  font-size:17px;background:color-mix(in srgb,var(--hi) 14%,transparent);
  border:1px solid color-mix(in srgb,var(--hi) 30%,transparent);
}
.row .body{flex:1;min-width:0}
.row .name{font-weight:600;font-size:16.5px;letter-spacing:-.01em;line-height:1.25;word-break:break-word}
.row .meta{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.09em;color:var(--ink-3);margin-top:3px;text-transform:uppercase}
.row .meta b{color:var(--hi);font-weight:500}
.row.done .name{color:var(--ink-2)}

.slot{
  position:relative;width:46px;height:46px;flex:none;border-radius:50%;
  border:2px dashed var(--rule-2);transition:border-color .15s, transform .12s;
}
.slot:hover{border-color:var(--hi)}
.slot.on{
  border:0;background:var(--desk);
  box-shadow:inset 0 3px 5px rgba(0,0,0,.95), 0 0 0 2.5px var(--hi), 0 1px 0 rgba(255,255,255,.4);
  animation:punch .22s ease-out;
}
@keyframes punch{0%{transform:scale(.72)}60%{transform:scale(1.09)}100%{transform:scale(1)}}
.chad{
  position:absolute;inset:6px;border-radius:50%;background:var(--stock);
  pointer-events:none;animation:chad .5s ease-in forwards;
}
@keyframes chad{to{transform:translateY(38px) rotate(52deg);opacity:0}}

/* ---------- number field ---------- */
.numwrap{flex:none;width:84px;display:flex;flex-direction:column;align-items:center;gap:4px}
.field{
  width:84px;height:42px;text-align:center;border-radius:3px;
  font-family:'DM Mono',monospace;font-size:15.5px;
  background:rgba(255,255,255,.42);border:1.5px dashed var(--rule-2);
}
.field::placeholder{color:var(--ink-3);font-size:13px}
.field:focus{outline:0;border-style:solid;border-color:var(--hi);background:rgba(255,255,255,.75)}
.field.met{
  color:var(--stock-2);background:var(--desk);border:0;
  box-shadow:inset 0 3px 5px rgba(0,0,0,.95), 0 0 0 2.5px var(--hi), 0 1px 0 rgba(255,255,255,.4);
}
.unit{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);text-align:center;line-height:1.2}

.off{opacity:.42}
.off .slot{border-style:solid;border-color:var(--rule)}
.off .slot::after{
  content:'';position:absolute;left:50%;top:50%;width:14px;height:1.5px;
  background:var(--rule-2);transform:translate(-50%,-50%);
}

/* ---------- daily note ---------- */
.note{margin-top:24px;border-top:1px dashed var(--rule-2);padding-top:16px}
.note-head{
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--ink-3);display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;
}
.note textarea{
  display:block;width:100%;min-height:78px;border:0;resize:none;overflow:hidden;
  font-size:15px;line-height:26px;padding:0;background:transparent;
  background-image:repeating-linear-gradient(transparent,transparent 25px,var(--rule) 25px,var(--rule) 26px);
}
.note textarea:focus{outline:0}
.note textarea::placeholder{color:var(--ink-3)}

/* ---------- week grid ---------- */
.grid{width:100%;border-collapse:collapse;font-family:'DM Mono',monospace}
.grid th{font-weight:400;font-size:10px;letter-spacing:.1em;color:var(--ink-3);padding:0 0 10px;text-transform:uppercase}
.grid th.d{width:34px}
.dayhd{display:block;width:100%;font-family:'DM Mono',monospace;font-size:10px;color:var(--ink-3);letter-spacing:.1em}
.dayhd span{display:block;font-size:12px;color:var(--ink-2);margin-top:2px}
.dayhd em{display:block;font-style:normal;font-size:9px;color:var(--mimeo);height:10px}
.dayhd.today span{color:var(--mimeo);font-weight:500}
.dayhd:hover span{color:var(--ink)}
.grid th.h{text-align:left}
.grid td{padding:7px 0;border-top:1px dotted var(--rule-2)}
.grid td.h{
  font-family:'Archivo';font-size:13.5px;font-weight:500;padding-right:10px;
  max-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.cell{width:24px;height:24px;border-radius:50%;margin:0 auto;display:block;border:1.5px dashed var(--rule-2)}
.cell.on{border:0;background:var(--desk);box-shadow:inset 0 2px 3px rgba(0,0,0,.9), 0 0 0 2px var(--hi)}
.cell.lo{border-style:solid;border-color:var(--hi);background:color-mix(in srgb,var(--hi) 25%,transparent)}
.cell.na{border:0;position:relative;cursor:default}
.cell.na::after{content:'';position:absolute;left:50%;top:50%;width:9px;height:1.5px;background:var(--rule);transform:translate(-50%,-50%)}
.cell.fut{border-style:solid;border-color:var(--rule);cursor:default;opacity:.5}
.cell.sel{outline:2px solid var(--mimeo);outline-offset:2px}
.week-note{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--ink-3);letter-spacing:.05em;margin-top:14px;line-height:1.6}

.editor{
  margin-top:14px;padding:14px;border:1px solid var(--rule-2);border-radius:2px;
  background:rgba(255,255,255,.4);
}
.editor .eh{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin-bottom:9px}
.editor .er{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.editor input[type=number]{flex:1;min-width:90px;background:rgba(255,255,255,.7);border:1px solid var(--rule-2);border-radius:2px;padding:10px;font-family:'DM Mono',monospace}
.editor textarea{width:100%;min-height:64px;background:rgba(255,255,255,.7);border:1px solid var(--rule-2);border-radius:2px;padding:10px;font-size:14.5px;line-height:1.55;resize:vertical}
.editor input:focus,.editor textarea:focus{outline:0;border-color:var(--mimeo)}
.btn{
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  padding:9px 13px;border-radius:2px;border:1px solid var(--rule-2);color:var(--ink-2);
}
.btn:hover{color:var(--ink);border-color:var(--ink-2)}
.btn.solid{background:var(--ink);color:var(--stock);border-color:var(--ink)}
.btn.solid:hover{background:var(--mimeo);border-color:var(--mimeo);color:var(--stock)}

/* ---------- stats ---------- */
.stat{padding:13px 0;border-bottom:1px dotted var(--rule-2)}
.stat:last-of-type{border-bottom:0}
.stat .top{display:flex;align-items:center;gap:12px}
.stat .nm{flex:1;font-weight:600;font-size:14.5px;min-width:0;word-break:break-word}
.stat .n{font-family:'DM Mono',monospace;text-align:right;width:54px;flex:none}
.stat .n b{display:block;font-size:15.5px;font-weight:500;color:var(--hi)}
.stat .n i{display:block;font-style:normal;font-size:9px;letter-spacing:.13em;color:var(--ink-3);text-transform:uppercase;margin-top:1px}
.spark{margin-top:9px;width:100%;height:34px;display:block;overflow:visible}
.spark-lab{font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-top:3px;display:flex;justify-content:space-between}

.month{display:flex;align-items:center;justify-content:space-between;margin:22px 0 12px}
.month h3{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:400}
.month button{font-family:'DM Mono',monospace;font-size:14px;color:var(--ink-3);padding:4px 9px;border:1px solid var(--rule-2);border-radius:2px}
.month button:hover{color:var(--ink);border-color:var(--ink-2)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;color:var(--ink-3);text-align:center;padding-bottom:2px}
.day{position:relative;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-family:'DM Mono',monospace;font-size:10px;color:var(--ink-3);border:1px solid var(--rule)}
.day.full{background:var(--desk);box-shadow:inset 0 2px 3px rgba(0,0,0,.9);border-color:transparent;color:transparent}
.day.part{border-color:transparent;color:var(--stock-2)}
.day.blank{border-color:transparent}
.day.tdy{outline:2px solid var(--mimeo);outline-offset:1px}
.day.noted::after{content:'';position:absolute;bottom:1px;width:3px;height:3px;border-radius:50%;background:var(--mimeo)}
.day.full.noted::after{background:var(--stock)}

.notelog{padding:12px 0;border-bottom:1px dotted var(--rule-2)}
.notelog:last-child{border-bottom:0}
.notelog .dt{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.notelog p{font-size:14.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}

/* ---------- data / sync ---------- */
.panel{border:1px solid var(--rule-2);border-radius:2px;background:rgba(255,255,255,.34);padding:16px;margin-bottom:14px}
.panel h4{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:400;color:var(--ink-2);margin-bottom:8px}
.panel p{font-size:13.5px;line-height:1.6;color:var(--ink-2);margin-bottom:12px}
.panel .er{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel input[type=text]{flex:1;min-width:180px;background:rgba(255,255,255,.72);border:1px solid var(--rule-2);border-radius:2px;padding:10px;font-family:'DM Mono',monospace;font-size:12px}
.panel input[type=text]:focus{outline:0;border-color:var(--mimeo)}
.status{font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-top:10px;display:flex;align-items:center;gap:7px}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none}
.status.live .dot{background:#2E7D4F}
.status.warn .dot{background:#A6322F}
.toggle{display:flex;align-items:center;gap:9px;margin-top:12px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.08em;color:var(--ink-2);cursor:pointer}
.toggle input{width:16px;height:16px;accent-color:var(--mimeo)}

/* ---------- edit ---------- */
.edit-item{border-bottom:1px dotted var(--rule-2);padding:16px 0}
.edit-item:last-of-type{border-bottom:0}
.edit-top{display:flex;align-items:center;gap:8px}
.emoji-in{width:40px;height:40px;flex:none;text-align:center;font-size:18px;background:rgba(255,255,255,.4);border:1px solid var(--rule-2);border-radius:2px}
.name-in{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px solid var(--rule-2);padding:8px 2px;font-size:15.5px;font-weight:600}
.name-in:focus{border-bottom-color:var(--mimeo);outline:0}
.icon-btn{font-family:'DM Mono',monospace;font-size:12px;color:var(--ink-3);padding:8px 7px;border-radius:2px}
.icon-btn:hover{color:var(--ink);background:rgba(0,0,0,.05)}
.edit-bot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px}
.inks{display:flex;gap:6px}
.ink-dot{width:20px;height:20px;border-radius:50%;border:2px solid transparent}
.ink-dot[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1.5px var(--stock) inset}
.days{display:flex;gap:4px}
.day-btn{
  width:26px;height:26px;border-radius:2px;font-family:'DM Mono',monospace;font-size:10.5px;
  border:1px solid var(--rule-2);color:var(--ink-3);
}
.day-btn[aria-pressed="true"]{background:var(--ink);color:var(--stock);border-color:var(--ink)}
.arch-btn{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-left:auto;padding:5px 8px;border:1px solid var(--rule-2);border-radius:2px}
.arch-btn:hover{color:#8E2B26;border-color:#8E2B26}
.type-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:11px}
.seg{display:flex;border:1px solid var(--rule-2);border-radius:2px;overflow:hidden;flex:none}
.seg button{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:7px 11px;color:var(--ink-3)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--stock)}
.mini{background:rgba(255,255,255,.5);border:1px solid var(--rule-2);border-radius:2px;padding:7px 8px;font-size:13px;font-family:'DM Mono',monospace;min-width:0}
input.mini{width:84px}
select.mini{width:auto;font-size:11.5px;letter-spacing:.06em}
.mini:focus{outline:0;border-color:var(--mimeo)}

.add{display:flex;gap:8px;margin-top:18px}
.add input{flex:1;min-width:0;background:rgba(255,255,255,.45);border:1px solid var(--rule-2);border-radius:2px;padding:12px;font-size:15px}
.add input:focus{outline:0;border-color:var(--mimeo)}
.add button{
  background:var(--ink);color:var(--stock);padding:0 18px;border-radius:2px;
  font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
}
.add button:hover{background:var(--mimeo)}

.archived{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:13.5px;color:var(--ink-3)}
.archived .nm{flex:1}
.archived button{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);padding:4px 7px;border:1px solid var(--rule-2);border-radius:2px}
.archived button:hover{color:var(--ink)}

.empty{text-align:center;padding:40px 10px}
.empty p{font-family:'DM Mono',monospace;font-size:12.5px;color:var(--ink-2);line-height:1.7}

.foot{
  font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(216,212,195,.34);text-align:center;margin-top:18px;
}
.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:9;
  background:var(--ink);color:var(--stock);padding:11px 16px;border-radius:2px;
  font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.08em;max-width:90vw;
  box-shadow:0 8px 24px rgba(0,0,0,.5);
}
@media (max-width:430px){
  :root{--pad:16px}
  .slot{width:42px;height:42px}
  .numwrap,.field{width:74px}
  .grid th.d{width:26px}
  .cell{width:21px;height:21px}
  .row{gap:11px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .chad{display:none}
}
</style>
</head>
<body>
<div class="shell">
  <div class="card">
    <header class="mast">
      <div class="serial"><span>Daily Card</span><span id="serial"></span></div>
      <h1 id="hdrDay">Today</h1>
      <div class="sub" id="hdrDate"></div>
      <div class="tally">
        <span class="count" id="tallyCount"></span>
        <div class="pips" id="pips"></div>
      </div>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="today" aria-selected="true">Today</button>
      <button class="tab" role="tab" data-tab="week" aria-selected="false">Week</button>
      <button class="tab" role="tab" data-tab="stats" aria-selected="false">Stats</button>
      <button class="tab" role="tab" data-tab="edit" aria-selected="false">Habits</button>
      <button class="tab" role="tab" data-tab="data" aria-selected="false">Data</button>
    </nav>

    <main class="view" id="view"></main>
  </div>
  <p class="foot">Punch one hole a day · Keep the card unbroken</p>
</div>

<script>
/* ---------------- data ---------------- */
const KEY = 'daily-card-v1';
const INKS = ['#4A3D8F','#A6322F','#17605C','#5C6B22','#23407A','#9A5A16'];
const DOW = ['S','M','T','W','T','F','S'];
const DOW_FULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

let state = null;
let tab = 'today';
let calCursor = new Date();
let editing = null;      // {mode:'num'|'note', id, k}
let focusNext = null;
let saveTimer = null;

function uid(){ return 'h' + Math.random().toString(36).slice(2,9); }

function starter(){
  return {habits:[
    {id:uid(), name:'Move for 20 minutes', emoji:'🏃', ink:INKS[0], days:[0,1,2,3,4,5,6], type:'check', unit:'', goal:null, goalDir:'min', archived:false},
    {id:uid(), name:'Read before bed', emoji:'📖', ink:INKS[2], days:[0,1,2,3,4,5,6], type:'check', unit:'', goal:null, goalDir:'min', archived:false},
    {id:uid(), name:'Steps', emoji:'👟', ink:INKS[4], days:[0,1,2,3,4,5,6], type:'number', unit:'steps', goal:8000, goalDir:'min', archived:false},
    {id:uid(), name:'Lights out by 11', emoji:'🌙', ink:INKS[5], days:[1,2,3,4,5], type:'check', unit:'', goal:null, goalDir:'min', archived:false}
  ], log:{}, notes:{}, settings:{clientId:'', linked:false, auto:true, lastSync:0}, updated:Date.now()};
}

function normalize(s){
  if(!s || !Array.isArray(s.habits)) s = starter();
  if(!s.log) s.log = {};
  if(!s.notes) s.notes = {};
  if(!s.settings) s.settings = {clientId:'', linked:false, auto:true, lastSync:0};
  if(s.settings.auto === undefined) s.settings.auto = true;
  if(!s.updated) s.updated = Date.now();
  s.habits.forEach(h=>{
    if(h.type !== 'number') h.type = 'check';
    if(typeof h.unit !== 'string') h.unit = '';
    if(h.goal === undefined) h.goal = null;
    if(h.goalDir !== 'max') h.goalDir = 'min';
    if(!Array.isArray(h.days) || !h.days.length) h.days = [0,1,2,3,4,5,6];
  });
  return s;
}

/* ---------------- dates ---------------- */
function key(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(d,n){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x; }
function today(){ const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); }
function parseKey(k){ const p=k.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
function pretty(k){ const d=parseKey(k); return DOW_FULL[d.getDay()].slice(0,3)+' '+MONTHS[d.getMonth()].slice(0,3)+' '+d.getDate(); }

/* ---------------- local storage ---------------- */
let storeOk = true;
function readLocal(){
  try{ const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; }
  catch(e){ storeOk = false; return null; }
}
function writeLocal(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ storeOk = false; toast('This browser is blocking storage, so nothing is being saved.'); }
}
async function loadState(){ return normalize(readLocal()); }

function persist(){
  state.updated = Date.now();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ writeLocal(); queueSync(); }, 300);
}

/* ---------------- merge (for sync + import) ---------------- */
function merge(a,b){
  if(!a) return normalize(b);
  if(!b) return normalize(a);
  const newer = (b.updated||0) >= (a.updated||0) ? b : a;
  const older = newer === a ? b : a;
  const out = {habits:[], log:{}, notes:{}, settings: newer.settings || older.settings || {},
               updated: Math.max(a.updated||0, b.updated||0)};
  [older,newer].forEach(src=>{
    Object.keys(src.log||{}).forEach(k=>{ out.log[k] = Object.assign({}, out.log[k], src.log[k]); });
    Object.keys(src.notes||{}).forEach(k=>{ if(src.notes[k]) out.notes[k] = src.notes[k]; });
  });
  const seen = new Set((newer.habits||[]).map(h=>h.id));
  out.habits = (newer.habits||[]).concat((older.habits||[]).filter(h=>!seen.has(h.id)));
  return normalize(out);
}

/* ---------------- backup file ---------------- */
function exportBackup(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'daily-card-' + key(today()) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  toast('Backup downloaded.');
}
function importBackup(file){
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const incoming = JSON.parse(r.result);
      if(!incoming || !Array.isArray(incoming.habits)) throw new Error('bad file');
      state = merge(state, incoming);
      writeLocal(); render();
      toast('Backup merged in.');
    }catch(e){ toast('That file isn\u2019t a Daily Card backup.'); }
  };
  r.onerror = ()=> toast('Could not read that file.');
  r.readAsText(file);
}

/* ---------------- google drive sync ---------------- */
const SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
const FNAME = 'daily-card.json';
let token = null, tokenExp = 0, syncing = false, syncTimer = null;

const cfg = () => state.settings;
const connected = () => !!(cfg().clientId && cfg().linked);

function loadGsi(){
  return new Promise((res,rej)=>{
    if(window.google && window.google.accounts && window.google.accounts.oauth2) return res();
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.onload = res;
    s.onerror = ()=> rej(new Error('Could not reach Google. Check your connection.'));
    document.head.appendChild(s);
  });
}
async function getToken(interactive){
  if(!cfg().clientId) throw new Error('Add your Google client ID first.');
  if(token && Date.now() < tokenExp - 60000) return token;
  await loadGsi();
  return new Promise((res,rej)=>{
    const tc = google.accounts.oauth2.initTokenClient({
      client_id: cfg().clientId.trim(),
      scope: SCOPE,
      callback: r=>{
        if(r.error) return rej(new Error(r.error_description || r.error));
        token = r.access_token;
        tokenExp = Date.now() + (Number(r.expires_in)||3600)*1000;
        res(token);
      },
      error_callback: e=> rej(new Error(e && e.type === 'popup_closed' ? 'Sign-in was closed.' : 'Google sign-in failed.'))
    });
    tc.requestAccessToken({prompt: interactive ? '' : 'none'});
  });
}
async function api(url, opts){
  const r = await fetch(url, opts);
  if(r.status === 401){ token = null; throw new Error('Google sign-in expired. Connect again.'); }
  if(!r.ok) throw new Error('Drive said no (' + r.status + ').');
  return r;
}
async function driveFind(t){
  const q = encodeURIComponent("name='" + FNAME + "' and trashed=false");
  const r = await api('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id)&q=' + q,
    {headers:{Authorization:'Bearer ' + t}});
  const j = await r.json();
  return (j.files && j.files[0]) ? j.files[0].id : null;
}
async function driveGet(t,id){
  const r = await api('https://www.googleapis.com/drive/v3/files/' + id + '?alt=media',
    {headers:{Authorization:'Bearer ' + t}});
  return r.json();
}
async function drivePut(t,id,doc){
  const body = JSON.stringify(doc);
  if(id){
    await api('https://www.googleapis.com/upload/drive/v3/files/' + id + '?uploadType=media',
      {method:'PATCH', headers:{Authorization:'Bearer ' + t,'Content-Type':'application/json'}, body});
    return id;
  }
  const b = '-------dailycard' + Date.now();
  const multi = '--' + b + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'
    + JSON.stringify({name:FNAME, parents:['appDataFolder']})
    + '\r\n--' + b + '\r\nContent-Type: application/json\r\n\r\n' + body + '\r\n--' + b + '--';
  const r = await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',
    {method:'POST', headers:{Authorization:'Bearer ' + t,'Content-Type':'multipart/related; boundary=' + b}, body:multi});
  const j = await r.json();
  return j.id;
}

async function sync(interactive){
  if(syncing || !cfg().clientId) return;
  syncing = true;
  if(tab === 'data') render();
  try{
    const t = await getToken(interactive);
    const id = await driveFind(t);
    if(id){
      let remote = null;
      try{ remote = await driveGet(t,id); }catch(e){ /* unreadable, overwrite below */ }
      if(remote && Array.isArray(remote.habits)) state = merge(state, remote);
    }
    state.settings.linked = true;
    state.settings.lastSync = Date.now();
    await drivePut(t, id, state);
    writeLocal();
    syncing = false; render();
    if(interactive) toast('Synced with your Drive.');
  }catch(e){
    syncing = false;
    if(interactive){ toast(e.message || 'Sync failed.'); render(); }
    else if(tab === 'data') render();
  }
}
function queueSync(){
  if(!connected() || !cfg().auto) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(()=>sync(false), 6000);
}
function disconnect(){
  state.settings.linked = false;
  token = null; tokenExp = 0;
  persist(); render();
  toast('Disconnected. Your Drive copy was left alone.');
}

/* ---------------- model helpers ---------------- */
const active = () => state.habits.filter(h=>!h.archived);
const scheduled = (h,d) => h.days.includes(d.getDay());

function value(h,k){
  const v = state.log[k] ? state.log[k][h.id] : undefined;
  return v === undefined ? null : v;
}
function logged(h,k){ return value(h,k) !== null; }
function done(h,k){
  const v = value(h,k);
  if(v === null || v === false) return false;
  if(h.type !== 'number') return true;
  if(typeof v !== 'number' || isNaN(v)) return false;
  if(h.goal === null || h.goal === '') return true;
  return h.goalDir === 'max' ? v <= h.goal : v >= h.goal;
}
function setValue(h,k,v){
  if(v === null){
    if(state.log[k]){ delete state.log[k][h.id]; if(!Object.keys(state.log[k]).length) delete state.log[k]; }
  }else{
    if(!state.log[k]) state.log[k] = {};
    state.log[k][h.id] = v;
  }
  persist();
}
function toggleCheck(h,k){ setValue(h,k, done(h,k) ? null : true); }

function setNote(k,text){
  if(text && text.trim()) state.notes[k] = text;
  else delete state.notes[k];
  persist();
}
const hasNote = k => !!(state.notes[k] && state.notes[k].trim());

function streak(h){
  let n=0, d=today(), guard=0;
  const tk = key(today());
  while(guard++ < 1500){
    const k = key(d);
    if(scheduled(h,d)){
      if(done(h,k)) n++;
      else if(k !== tk) break;
    }
    d = addDays(d,-1);
  }
  return n;
}
function longest(h){
  const keys = Object.keys(state.log).sort();
  let best = streak(h);
  if(!keys.length) return best;
  let d = parseKey(keys[0]), end = today(), cur = 0, tk = key(end), guard = 0;
  while(d <= end && guard++ < 4000){
    if(scheduled(h,d)){
      if(done(h,key(d))){ cur++; if(cur>best) best=cur; }
      else if(key(d) !== tk) cur = 0;
    }
    d = addDays(d,1);
  }
  return best;
}
function rate30(h){
  let s=0, c=0;
  for(let i=29;i>=0;i--){
    const d = addDays(today(),-i);
    if(scheduled(h,d)){ s++; if(done(h,key(d))) c++; }
  }
  return s ? Math.round(c/s*100) : 0;
}
function series(h,n){
  const out = [];
  for(let i=n-1;i>=0;i--){
    const d = addDays(today(),-i), v = value(h,key(d));
    out.push({d, v: (typeof v === 'number' ? v : null)});
  }
  return out;
}
function dayRatio(d){
  const hs = active().filter(h=>scheduled(h,d));
  if(!hs.length) return null;
  return hs.filter(h=>done(h,key(d))).length / hs.length;
}
function fmt(n){ return typeof n === 'number' ? n.toLocaleString() : n; }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let toastTimer = null;
function toast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const el = document.createElement('div');
  el.className='toast'; el.setAttribute('role','status'); el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.remove(), 3400);
}

/* ---------------- today ---------------- */
function goalText(h){
  if(h.goal === null || h.goal === '') return 'Log a number';
  return (h.goalDir==='max' ? 'Under ' : 'Target ')+fmt(h.goal)+(h.unit?' '+h.unit:'');
}

function todayRow(h,k){
  const on = done(h,k), s = streak(h), v = value(h,k);
  let meta;
  if(h.type === 'number'){
    meta = logged(h,k)
      ? '<b>'+fmt(v)+(h.unit?' '+esc(h.unit):'')+'</b>'+(s>1?' · '+s+' day run':'')
      : goalText(h);
  }else{
    meta = s>1 ? '<b>'+s+' day run</b>' : (on ? '<b>Punched</b>' : 'Open');
  }
  const control = h.type === 'number'
    ? '<div class="numwrap"><input class="field'+(on?' met':'')+'" type="number" inputmode="decimal" step="any" '
      + 'value="'+(v===null?'':v)+'" placeholder="—" data-act="num" data-id="'+h.id+'" data-k="'+k+'" '
      + 'aria-label="'+esc(h.name)+'"><span class="unit">'+esc(h.unit || 'today')+'</span></div>'
    : '<button class="slot'+(on?' on':'')+'" data-act="punch" data-id="'+h.id+'" data-k="'+k+'" '
      + 'aria-pressed="'+on+'" aria-label="'+esc(h.name)+'"></button>';

  return '<div class="row'+(on?' done':'')+'" style="--hi:'+h.ink+'">'
    + '<div class="glyph">'+esc(h.emoji||'•')+'</div>'
    + '<div class="body"><div class="name">'+esc(h.name)+'</div><div class="meta">'+meta+'</div></div>'
    + control + '</div>';
}

function noteBlock(k){
  const words = (state.notes[k]||'').trim() ? (state.notes[k].trim().split(/\s+/).length+' words') : '';
  return '<div class="note"><div class="note-head"><span>Note for the day</span><span>'+words+'</span></div>'
    + '<textarea id="dayNote" data-act="note" data-k="'+k+'" rows="3" '
    + 'placeholder="How did it go? What got in the way?">'+esc(state.notes[k]||'')+'</textarea></div>';
}

function renderToday(){
  const t = today(), k = key(t);
  const due = active().filter(h=>scheduled(h,t));
  const rest = active().filter(h=>!scheduled(h,t));

  if(!active().length){
    return '<div class="empty"><p>Your card is blank.<br>Add a habit to start punching holes.</p>'
      + '<div class="add" style="max-width:360px;margin:20px auto 0"><input id="quickAdd" placeholder="e.g. Walk after lunch" aria-label="New habit"><button data-act="quick">Add</button></div></div>'
      + noteBlock(k);
  }

  let html = due.length
    ? due.map(h=>todayRow(h,k)).join('')
    : '<div class="empty"><p>Nothing scheduled for '+DOW_FULL[t.getDay()]+'.<br>A rest day is still a day on plan.</p></div>';

  if(rest.length){
    html += '<div class="lab">Not on today\u2019s card</div>'
      + rest.map(h=>'<div class="row off" style="--hi:'+h.ink+'">'
        + '<div class="glyph">'+esc(h.emoji||'•')+'</div>'
        + '<div class="body"><div class="name">'+esc(h.name)+'</div>'
        + '<div class="meta">'+h.days.map(d=>DOW[d]).join(' ')+'</div></div>'
        + '<span class="slot"></span></div>').join('');
  }
  return html + noteBlock(k);
}

function renderEditor(){

  if(editing.mode === 'note'){
    return '<div class="editor"><div class="eh">Note · '+pretty(k)+'</div>'
      + '<textarea id="edNote" placeholder="Anything worth remembering about this day">'+esc(state.notes[k]||'')+'</textarea>'

      + '<button class="btn" data-act="closeEd">Close</button></div></div>';

function renderWeek(){
  const t = today();
  const days = []; for(let i=6;i>=0;i--) days.push(addDays(t,-i));
  const hs = active();
  if(!hs.length) return '<div class="empty"><p>No habits yet — nothing to chart.</p></div>';

  html += hs.map(h=>'<tr style="--hi:'+h.ink+'"><td class="h">'+esc(h.name)+'</td>'

        const act = h.type==='number' ? 'editNum' : 'punch';

          + 'data-id="'+h.id+'" data-k="'+k+'" aria-pressed="'+on+'" aria-label="'+label+'"></button></td>';
      }).join('') + '</tr>').join('');

  html += '</tbody></table>' + renderEditor()
    + '<p class="week-note">Tap a circle to fill in a day you missed logging — number habits open a field.<br>'
    + 'Tap a date at the top to write or read that day\u2019s note. A dash means the habit wasn\u2019t scheduled.</p>';
  return html;
}

/* ---------------- stats ---------------- */
function sparkline(h){
  const pts = series(h,30).map((p,i)=>({i,v:p.v})).filter(p=>p.v!==null);
  if(pts.length < 2) return '';
  const vals = pts.map(p=>p.v);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if(hi === lo){ hi = lo + 1; lo = lo - 1; }
  const W = 300, H = 30;
  const x = i => (i/29)*W;
  const y = v => H - ((v-lo)/(hi-lo))*H;
  const line = pts.map((p,n)=>(n?'L':'M')+x(p.i).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  const last = pts[pts.length-1];
  const gk = (h.goal!==null && h.goal!=='' && h.goal>=lo && h.goal<=hi)
    ? '<line x1="0" y1="'+y(h.goal).toFixed(1)+'" x2="'+W+'" y2="'+y(h.goal).toFixed(1)+'" stroke="'+h.ink+'" stroke-width="1" stroke-dasharray="3 3" opacity=".45"/>' : '';
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true">'
    + gk + '<path d="'+line+'" fill="none" stroke="'+h.ink+'" stroke-width="1.8" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>'
    + '<circle cx="'+x(last.i).toFixed(1)+'" cy="'+y(last.v).toFixed(1)+'" r="2.6" fill="'+h.ink+'" vector-effect="non-scaling-stroke"/></svg>'
    + '<div class="spark-lab"><span>30 days ago</span><span>Low '+fmt(lo)+' · High '+fmt(hi)+'</span></div>';
}

function renderStats(){
  const hs = active();
  let html = '';
  if(hs.length){
    html += '<div class="lab">Per habit</div>';
    html += hs.map(h=>{
      const nums = series(h,30).map(p=>p.v).filter(v=>v!==null);
      const avg = nums.length ? Math.round(nums.reduce((a,b)=>a+b,0)/nums.length*10)/10 : null;
      const third = h.type==='number'
        ? '<span class="n"><b>'+(avg===null?'—':fmt(avg))+'</b><i>Avg</i></span>'
        : '<span class="n"><b>'+rate30(h)+'%</b><i>30 day</i></span>';
      return '<div class="stat" style="--hi:'+h.ink+'"><div class="top">'
        + '<span class="nm">'+esc(h.emoji||'')+' '+esc(h.name)+'</span>'
        + '<span class="n"><b>'+streak(h)+'</b><i>Now</i></span>'
        + '<span class="n"><b>'+longest(h)+'</b><i>Best</i></span>'
        + third + '</div>'
        + (h.type==='number' ? sparkline(h) : '') + '</div>';
    }).join('');
  }

  const c = new Date(calCursor.getFullYear(), calCursor.getMonth(), 1);
  html += '<div class="month"><button data-act="cal" data-step="-1" aria-label="Previous month">&larr;</button>'
    + '<h3>'+MONTHS[c.getMonth()]+' '+c.getFullYear()+'</h3>'
    + '<button data-act="cal" data-step="1" aria-label="Next month">&rarr;</button></div>';

  html += '<div class="cal">' + DOW.map(d=>'<div class="dow">'+d+'</div>').join('');
  for(let i=0;i<c.getDay();i++) html += '<div class="day blank"></div>';
  const last = new Date(c.getFullYear(), c.getMonth()+1, 0).getDate();
  const tk = key(today());
  for(let i=1;i<=last;i++){
    const d = new Date(c.getFullYear(), c.getMonth(), i), k = key(d);
    const r = d > today() ? null : dayRatio(d);
    let cls = 'day', style = '';
    if(r === 1) cls += ' full';
    else if(r !== null && r > 0){ cls += ' part'; style = ' style="background:rgba(22,26,25,'+(0.18+r*0.6).toFixed(2)+');"'; }
    if(hasNote(k)) cls += ' noted';
    if(k === tk) cls += ' tdy';
    html += '<div class="'+cls+'"'+style+' title="'+MONTHS[c.getMonth()]+' '+i+'">'+i+'</div>';
  }
  html += '</div><p class="week-note">Darker days are fuller days. A dot marks a day with a note.</p>';

  const nk = Object.keys(state.notes).filter(k=>state.notes[k].trim()).sort().reverse().slice(0,12);
  if(nk.length){
    html += '<div class="lab">Recent notes</div>'
      + nk.map(k=>'<div class="notelog"><div class="dt">'+pretty(k)+'</div><p>'+esc(state.notes[k])+'</p></div>').join('');
  }
  return html;
}

/* ---------------- edit ---------------- */
function renderEdit(){
  const live = state.habits.filter(h=>!h.archived);
  const gone = state.habits.filter(h=>h.archived);

  let html = live.map((h,i)=>{
    const num = h.type === 'number';
    const numFields = num
      ? '<input class="mini" value="'+esc(h.unit)+'" placeholder="unit" data-act="unit" data-id="'+h.id+'" aria-label="Unit, e.g. steps">'
        + '<select class="mini" data-act="goalDir" data-id="'+h.id+'" aria-label="Target type">'
        + '<option value="min"'+(h.goalDir==='min'?' selected':'')+'>At least</option>'
        + '<option value="max"'+(h.goalDir==='max'?' selected':'')+'>At most</option>'
        + '<option value="none"'+(h.goal===null?' selected':'')+'>No target</option></select>'
        + (h.goal===null ? '' : '<input class="mini" type="number" step="any" value="'+h.goal+'" placeholder="target" data-act="goal" data-id="'+h.id+'" aria-label="Target number">')
      : '';
    return '<div class="edit-item" style="--hi:'+h.ink+'">'
      + '<div class="edit-top">'
        + '<input class="emoji-in" value="'+esc(h.emoji||'')+'" maxlength="2" data-act="emoji" data-id="'+h.id+'" aria-label="Icon">'
        + '<input class="name-in" value="'+esc(h.name)+'" data-act="name" data-id="'+h.id+'" aria-label="Habit name">'
        + '<button class="icon-btn" data-act="move" data-id="'+h.id+'" data-step="-1" aria-label="Move up"'+(i===0?' disabled style="opacity:.25"':'')+'>&uarr;</button>'
        + '<button class="icon-btn" data-act="move" data-id="'+h.id+'" data-step="1" aria-label="Move down"'+(i===live.length-1?' disabled style="opacity:.25"':'')+'>&darr;</button>'
      + '</div>'
      + '<div class="type-row">'
        + '<div class="seg"><button data-act="type" data-id="'+h.id+'" data-type="check" aria-pressed="'+(!num)+'">Tick off</button>'
        + '<button data-act="type" data-id="'+h.id+'" data-type="number" aria-pressed="'+num+'">Number</button></div>'
        + numFields
      + '</div>'
      + '<div class="edit-bot">'
        + '<div class="inks">'+INKS.map(c=>'<button class="ink-dot" style="background:'+c+'" data-act="ink" data-id="'+h.id+'" data-ink="'+c+'" aria-pressed="'+(h.ink===c)+'" aria-label="Ink colour"></button>').join('')+'</div>'
        + '<div class="days">'+DOW.map((d,n)=>'<button class="day-btn" data-act="day" data-id="'+h.id+'" data-day="'+n+'" aria-pressed="'+h.days.includes(n)+'" aria-label="'+DOW_FULL[n]+'">'+d+'</button>').join('')+'</div>'
        + '<button class="arch-btn" data-act="archive" data-id="'+h.id+'">Archive</button>'
      + '</div></div>';
  }).join('');

  if(!live.length) html = '<div class="empty"><p>No habits on the card.<br>Add one below.</p></div>';

  html += '<div class="add"><input id="newHabit" placeholder="Add a habit" aria-label="New habit name">'
        + '<button data-act="add">Add</button></div>';

  if(gone.length){
    html += '<div class="lab">Archived</div>' + gone.map(h=>'<div class="archived">'
      + '<span class="nm">'+esc(h.emoji||'')+' '+esc(h.name)+'</span>'
      + '<button data-act="restore" data-id="'+h.id+'">Restore</button>'
      + '<button data-act="delete" data-id="'+h.id+'">Delete</button></div>').join('');
  }
  return html;
}

/* ---------------- data tab ---------------- */
function renderData(){
  const s = cfg();
  const days = Object.keys(state.log).length, notes = Object.keys(state.notes).length;
  const last = s.lastSync ? new Date(s.lastSync) : null;

  let statusCls = 'status', statusTxt;
  if(syncing){ statusTxt = 'Syncing…'; }
  else if(connected()){ statusCls += ' live'; statusTxt = last ? 'Last synced ' + last.toLocaleString() : 'Connected'; }
  else if(s.clientId){ statusCls += ' warn'; statusTxt = 'Not connected'; }
  else { statusTxt = 'Sync is off — this device only'; }

  return '<div class="panel"><h4>This device</h4>'
    + '<p>' + days + ' day' + (days===1?'':'s') + ' logged · ' + notes + ' note' + (notes===1?'':'s') + ' written. '
    + (storeOk ? 'Saved in this browser.' : 'This browser is blocking storage — nothing is being saved.') + '</p>'
    + '<div class="er"><button class="btn solid" data-act="export">Download backup</button>'
    + '<button class="btn" data-act="pickImport">Restore from file</button>'
    + '<input type="file" id="importFile" accept="application/json,.json" hidden></div>'
    + '<p style="margin:12px 0 0;font-size:12.5px">A backup is a single JSON file. Keep it in Drive, iCloud, or anywhere else — restoring merges it back in without wiping what\u2019s already here.</p></div>'

    + '<div class="panel"><h4>Sync across devices</h4>'
    + '<p>Keeps one copy of your card in your own Google Drive, in a private app folder only this app can see. Paste the client ID from your Google Cloud project — setup steps are in the README.</p>'
    + '<div class="er"><input type="text" id="clientId" placeholder="xxxxx.apps.googleusercontent.com" value="' + esc(s.clientId||'') + '" spellcheck="false" aria-label="Google client ID">'
    + '<button class="btn solid" data-act="connect">' + (connected() ? 'Sync now' : 'Connect') + '</button>'
    + (connected() ? '<button class="btn" data-act="disconnect">Disconnect</button>' : '') + '</div>'
    + '<label class="toggle"><input type="checkbox" data-act="auto"' + (s.auto ? ' checked' : '') + '>Sync automatically after changes</label>'
    + '<div class="' + statusCls + '"><span class="dot"></span>' + esc(statusTxt) + '</div></div>'

    + '<div class="panel"><h4>If two devices disagree</h4>'
    + '<p>Nothing is thrown away. Days and notes from both devices are combined, and whichever device saved most recently wins any direct clash on the same entry. Your habit list comes from the most recently edited device.</p></div>';
}

function grow(el){ if(!el) return; el.style.height='auto'; el.style.height=(el.scrollHeight+2)+'px'; }

function render(){
  renderMast();
  const v = document.getElementById('view');
  v.innerHTML = tab==='today' ? renderToday()
              : tab==='week'  ? renderWeek()
              : tab==='stats' ? renderStats()
              : tab==='data'  ? renderData()
              : renderEdit();
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected', String(b.dataset.tab===tab)));
  grow(document.getElementById('dayNote'));
  if(focusNext){ const el = document.getElementById(focusNext); if(el){ el.focus(); if(el.select) el.select(); } focusNext = null; }
}

/* ---------------- events ---------------- */
document.querySelector('.tabs').addEventListener('click', e=>{
  const b = e.target.closest('.tab'); if(!b) return;
  tab = b.dataset.tab; editing = null; render();
});

function addHabit(name){
  name = (name||'').trim();
  if(!name){ toast('Give the habit a name first.'); return; }
  state.habits.push({id:uid(), name, emoji:'', ink:INKS[state.habits.length % INKS.length],
    days:[0,1,2,3,4,5,6], type:'check', unit:'', goal:null, goalDir:'min', archived:false});
  persist(); render();
}

const view = document.getElementById('view');

view.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b || b.tagName === 'INPUT' || b.tagName === 'TEXTAREA' || b.tagName === 'SELECT') return;
  const act = b.dataset.act;
  const h = state.habits.find(x=>x.id===b.dataset.id);

  if(act==='punch'){
    const wasOn = b.classList.contains('on');
    toggleCheck(h, b.dataset.k);
    if(!wasOn && b.classList.contains('slot')){
      const chad = document.createElement('span'); chad.className='chad';
      b.appendChild(chad); setTimeout(()=>chad.remove(),520);
      b.classList.add('on'); b.setAttribute('aria-pressed','true');
      renderMast(); setTimeout(render,190); return;
    }
    render(); return;
  }
  if(act==='editNum'){
    editing = {mode:'num', id:h.id, k:b.dataset.k};
    focusNext = 'edNum'; render(); return;
  }
  if(act==='noteFor'){
    const k = b.dataset.k;
    editing = (editing && editing.mode==='note' && editing.k===k) ? null : {mode:'note', k};
    if(editing) focusNext = 'edNote';
    render(); return;
  }
  if(act==='saveNum'){
    const raw = document.getElementById('edNum').value.trim();
    const hh = state.habits.find(x=>x.id===editing.id);
    setValue(hh, editing.k, raw==='' ? null : Number(raw));
    editing = null; render(); return;
  }
  if(act==='clearNum'){
    const hh = state.habits.find(x=>x.id===editing.id);
    setValue(hh, editing.k, null); editing = null; render(); return;
  }
  if(act==='saveNote'){
    setNote(editing.k, document.getElementById('edNote').value);
    editing = null; render(); toast('Note saved.'); return;
  }
  if(act==='closeEd'){ editing = null; render(); return; }
  if(act==='type'){
    h.type = b.dataset.type;
    persist(); render(); return;
  }
  if(act==='ink'){ h.ink = b.dataset.ink; persist(); render(); return; }
  if(act==='day'){
    const d = Number(b.dataset.day);
    h.days = h.days.includes(d) ? h.days.filter(x=>x!==d) : h.days.concat(d).sort();
    if(!h.days.length){ h.days=[d]; toast('A habit needs at least one day.'); }
    persist(); render(); return;
  }
  if(act==='move'){
    const step = Number(b.dataset.step), i = state.habits.indexOf(h), j = i+step;
    if(j<0 || j>=state.habits.length) return;
    state.habits.splice(j,0,state.habits.splice(i,1)[0]);
    persist(); render(); return;
  }
  if(act==='archive'){ h.archived = true; persist(); render(); toast('Archived. Its history is kept.'); return; }
  if(act==='restore'){ h.archived = false; persist(); render(); return; }
  if(act==='delete'){
    state.habits = state.habits.filter(x=>x.id!==h.id);
    Object.keys(state.log).forEach(k=>{ delete state.log[k][h.id]; if(!Object.keys(state.log[k]).length) delete state.log[k]; });
    persist(); render(); toast('Deleted for good.'); return;
  }
  if(act==='cal'){ calCursor.setMonth(calCursor.getMonth()+Number(b.dataset.step)); render(); return; }
  if(act==='export'){ exportBackup(); return; }
  if(act==='pickImport'){ document.getElementById('importFile').click(); return; }
  if(act==='connect'){
    const id = document.getElementById('clientId').value.trim();
    if(!id){ toast('Paste your Google client ID first.'); return; }
    state.settings.clientId = id; writeLocal();
    sync(true); return;
  }
  if(act==='disconnect'){ disconnect(); return; }
  if(act==='add'){ addHabit(document.getElementById('newHabit').value); return; }
  if(act==='quick'){ addHabit(document.getElementById('quickAdd').value); return; }
});

view.addEventListener('input', e=>{
  const el = e.target, act = el.dataset.act;
  if(!act) return;
  const h = state.habits.find(x=>x.id===el.dataset.id);

  if(act==='name'){ h.name = el.value; persist(); return; }
  if(act==='emoji'){ h.emoji = el.value; persist(); return; }
  if(act==='unit'){ h.unit = el.value; persist(); return; }
  if(act==='goal'){ h.goal = el.value==='' ? null : Number(el.value); persist(); return; }
  if(act==='note'){ setNote(el.dataset.k, el.value); grow(el); return; }
  if(act==='num'){
    const raw = el.value.trim();
    setValue(h, el.dataset.k, raw==='' ? null : Number(raw));
    el.classList.toggle('met', done(h, el.dataset.k));
    renderMast();
    return;
  }
});

view.addEventListener('change', e=>{
  const el = e.target;
  if(el.id === 'importFile'){
    if(el.files && el.files[0]) importBackup(el.files[0]);
    el.value = ''; return;
  }
  if(el.dataset.act === 'auto'){
    state.settings.auto = el.checked; persist();
    toast(el.checked ? 'Auto-sync on.' : 'Auto-sync off — use Sync now.');
    return;
  }
  if(el.dataset.act === 'goalDir'){
    const h = state.habits.find(x=>x.id===el.dataset.id);
    if(el.value === 'none'){ h.goal = null; }
    else { h.goalDir = el.value; if(h.goal === null) h.goal = 0; }
    persist(); render();
  }
});

view.addEventListener('focusout', e=>{
  if(e.target.dataset && e.target.dataset.act === 'num') render();
}, true);

view.addEventListener('keydown', e=>{
  if(e.key === 'Escape' && editing){ editing = null; render(); return; }
  if(e.key !== 'Enter') return;
  if(e.target.id === 'newHabit'){ addHabit(e.target.value); focusNext='newHabit'; }
  else if(e.target.id === 'quickAdd'){ addHabit(e.target.value); }
  else if(e.target.id === 'edNum'){ document.querySelector('[data-act="saveNum"]').click(); }
  else if(e.target.classList.contains('name-in') || e.target.dataset.act === 'num'){ e.target.blur(); }
});

document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && !editing) render(); });

/* ---------------- boot ---------------- */
(async function(){
  state = await loadState();
  writeLocal();
  render();
  if(!storeOk) toast('This browser is blocking storage, so nothing will be saved.');

  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  }
  if(connected()) sync(false);

  let awayAt = Date.now();
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden){ awayAt = Date.now(); return; }
    if(connected() && Date.now() - awayAt > 60000) sync(false);
  });
})();
</script>
</body>
</html>
