<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Card — habit tracker</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#161A19">
<meta name="description" content="A private daily habit tracker.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Card">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="167x167" href="./apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#161A19;
  --stock:#D8D4C3;
  --stock-2:#E5E2D4;
  --ink:#1C211F;
  --ink-2:#4B534E;
  --ink-3:#7C837D;
  --rule:rgba(28,33,31,.16);
  --rule-2:rgba(28,33,31,.30);
  --mimeo:#4A3D8F;
  --hi:#4A3D8F;
  --radius:3px;
  --pad:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--desk);
  background-image:
    radial-gradient(circle at 20% 0%, rgba(74,61,143,.18), transparent 55%),
    radial-gradient(circle at 95% 100%, rgba(23,96,92,.14), transparent 50%);
  color:var(--ink);
  font-family:'Archivo',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:26px 16px 60px;
  display:flex;justify-content:center;
}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--mimeo);outline-offset:2px}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}

.shell{width:100%;max-width:620px}

/* ---------- the card ---------- */
.card{
  position:relative;
  background:var(--stock);
  background-image:linear-gradient(178deg,var(--stock-2),var(--stock) 40%);
  border-radius:var(--radius);
  box-shadow:0 18px 44px rgba(0,0,0,.45), 0 2px 0 rgba(255,255,255,.22) inset;
  padding:0 0 8px;
  overflow:hidden;
}
.card::before,.card::after{
  content:'';position:absolute;left:0;right:0;height:9px;pointer-events:none;z-index:3;
  background-image:radial-gradient(circle at 7px 0, var(--desk) 3.6px, transparent 4.1px);
  background-size:14px 9px;
}
.card::before{top:0}
.card::after{bottom:0;transform:rotate(180deg)}

/* ---------- masthead ---------- */
.mast{padding:26px var(--pad) 16px;border-bottom:1px solid var(--rule-2);position:relative}
.mast .serial{
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--ink-3);display:flex;justify-content:space-between;
}
.mast h1{
  font-size:clamp(30px,8.5vw,46px);font-weight:800;letter-spacing:-.035em;
  line-height:.95;margin:10px 0 2px;
}
.mast .sub{font-family:'DM Mono',monospace;font-size:12px;color:var(--ink-2);letter-spacing:.04em}

.tally{display:flex;align-items:center;gap:12px;margin-top:18px}
.tally .count{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.pips{display:flex;gap:6px;flex-wrap:wrap}
.pip{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--rule-2)}
.pip.on{border-color:transparent;background:var(--desk);box-shadow:inset 0 1px 2px rgba(0,0,0,.9)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;padding:12px var(--pad) 0;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:1 0 auto;min-width:62px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  padding:9px 6px;color:var(--ink-3);border-bottom:2px solid transparent;text-align:center;white-space:nowrap;
}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--mimeo)}
.tab:hover{color:var(--ink)}

.view{padding:6px var(--pad) 22px}

.lab{
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--ink-3);margin:22px 0 8px;display:flex;align-items:center;gap:10px;
}
.lab::after{content:'';flex:1;height:1px;background:var(--rule)}

/* ---------- today rows ---------- */
.row{
  display:flex;align-items:center;gap:14px;padding:14px 0;
  border-bottom:1px dotted var(--rule-2);
}
.row:last-child{border-bottom:0}
.row .glyph{
  width:34px;height:34px;flex:none;border-radius:2px;display:grid;place-items:center;
  font-size:17px;background:color-mix(in srgb,var(--hi) 14%,transparent);
  border:1px solid color-mix(in srgb,var(--hi) 30%,transparent);
}
.row .body{flex:1;min-width:0}
.row .name{font-weight:600;font-size:16.5px;letter-spacing:-.01em;line-height:1.25;word-break:break-word}
.row .meta{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.09em;color:var(--ink-3);margin-top:3px;text-transform:uppercase}
.row .meta b{color:var(--hi);font-weight:500}
.row.done .name{color:var(--ink-2)}

.slot{
  position:relative;width:46px;height:46px;flex:none;border-radius:50%;
  border:2px dashed var(--rule-2);transition:border-color .15s, transform .12s;
}
.slot:hover{border-color:var(--hi)}
.slot.on{
  border:0;background:var(--desk);
  box-shadow:inset 0 3px 5px rgba(0,0,0,.95), 0 0 0 2.5px var(--hi), 0 1px 0 rgba(255,255,255,.4);
  animation:punch .22s ease-out;
}
@keyframes punch{0%{transform:scale(.72)}60%{transform:scale(1.09)}100%{transform:scale(1)}}
.chad{
  position:absolute;inset:6px;border-radius:50%;background:var(--stock);
  pointer-events:none;animation:chad .5s ease-in forwards;
}
@keyframes chad{to{transform:translateY(38px) rotate(52deg);opacity:0}}

/* ---------- number field ---------- */
.numwrap{flex:none;width:84px;display:flex;flex-direction:column;align-items:center;gap:4px}
.field{
  width:84px;height:42px;text-align:center;border-radius:3px;
  font-family:'DM Mono',monospace;font-size:15.5px;
  background:rgba(255,255,255,.42);border:1.5px dashed var(--rule-2);
}
.field::placeholder{color:var(--ink-3);font-size:13px}
.field:focus{outline:0;border-style:solid;border-color:var(--hi);background:rgba(255,255,255,.75)}
.field.met{
  color:var(--stock-2);background:var(--desk);border:0;
  box-shadow:inset 0 3px 5px rgba(0,0,0,.95), 0 0 0 2.5px var(--hi), 0 1px 0 rgba(255,255,255,.4);
}
.unit{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);text-align:center;line-height:1.2}

.off{opacity:.42}
.off .slot{border-style:solid;border-color:var(--rule)}
.off .slot::after{
  content:'';position:absolute;left:50%;top:50%;width:14px;height:1.5px;
  background:var(--rule-2);transform:translate(-50%,-50%);
}

/* ---------- daily note ---------- */
.note{margin-top:24px;border-top:1px dashed var(--rule-2);padding-top:16px}
.note-head{
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--ink-3);display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;
}
.note textarea{
  display:block;width:100%;min-height:78px;border:0;resize:none;overflow:hidden;
  font-size:15px;line-height:26px;padding:0;background:transparent;
  background-image:repeating-linear-gradient(transparent,transparent 25px,var(--rule) 25px,var(--rule) 26px);
}
.note textarea:focus{outline:0}
.note textarea::placeholder{color:var(--ink-3)}

/* ---------- week grid ---------- */
.grid{width:100%;border-collapse:collapse;font-family:'DM Mono',monospace}
.grid th{font-weight:400;font-size:10px;letter-spacing:.1em;color:var(--ink-3);padding:0 0 10px;text-transform:uppercase}
.grid th.d{width:34px}
.dayhd{display:block;width:100%;font-family:'DM Mono',monospace;font-size:10px;color:var(--ink-3);letter-spacing:.1em}
.dayhd span{display:block;font-size:12px;color:var(--ink-2);margin-top:2px}
.dayhd em{display:block;font-style:normal;font-size:9px;color:var(--mimeo);height:10px}
.dayhd.today span{color:var(--mimeo);font-weight:500}
.dayhd:hover span{color:var(--ink)}
.grid th.h{text-align:left}
.grid td{padding:7px 0;border-top:1px dotted var(--rule-2)}
.grid td.h{
  font-family:'Archivo';font-size:13.5px;font-weight:500;padding-right:10px;
  max-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.cell{width:24px;height:24px;border-radius:50%;margin:0 auto;display:block;border:1.5px dashed var(--rule-2)}
.cell.on{border:0;background:var(--desk);box-shadow:inset 0 2px 3px rgba(0,0,0,.9), 0 0 0 2px var(--hi)}
.cell.lo{border-style:solid;border-color:var(--hi);background:color-mix(in srgb,var(--hi) 25%,transparent)}
.cell.xx{border:1.5px solid rgba(166,50,47,.5);position:relative;background:rgba(166,50,47,.1)}
.cell.xx::after{content:'\2715';position:absolute;inset:0;display:grid;place-items:center;
  font-size:11px;color:#A6322F;line-height:1}
.cell.na{border:0;position:relative;cursor:default}
.cell.na::after{content:'';position:absolute;left:50%;top:50%;width:9px;height:1.5px;background:var(--rule);transform:translate(-50%,-50%)}
.cell.fut{border-style:solid;border-color:var(--rule);cursor:default;opacity:.5}
.cell.sel{outline:2px solid var(--mimeo);outline-offset:2px}
.week-note{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--ink-3);letter-spacing:.05em;margin-top:14px;line-height:1.6}

.editor{
  margin-top:14px;padding:14px;border:1px solid var(--rule-2);border-radius:2px;
  background:rgba(255,255,255,.4);
}
.editor .eh{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin-bottom:9px}
.editor .er{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.editor input[type=number]{flex:1;min-width:90px;background:rgba(255,255,255,.7);border:1px solid var(--rule-2);border-radius:2px;padding:10px;font-family:'DM Mono',monospace}
.editor textarea{width:100%;min-height:64px;background:rgba(255,255,255,.7);border:1px solid var(--rule-2);border-radius:2px;padding:10px;font-size:14.5px;line-height:1.55;resize:vertical}
.editor input:focus,.editor textarea:focus{outline:0;border-color:var(--mimeo)}
.btn{
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  padding:9px 13px;border-radius:2px;border:1px solid var(--rule-2);color:var(--ink-2);
}
.btn:hover{color:var(--ink);border-color:var(--ink-2)}
.btn.solid{background:var(--ink);color:var(--stock);border-color:var(--ink)}
.btn.solid:hover{background:var(--mimeo);border-color:var(--mimeo);color:var(--stock)}

/* ---------- stats ---------- */
.stat{padding:13px 0;border-bottom:1px dotted var(--rule-2)}
.stat:last-of-type{border-bottom:0}
.stat .top{display:flex;align-items:center;gap:12px}
.stat .nm{flex:1;font-weight:600;font-size:14.5px;min-width:0;word-break:break-word}
.stat .n{font-family:'DM Mono',monospace;text-align:right;width:54px;flex:none}
.stat .n b{display:block;font-size:15.5px;font-weight:500;color:var(--hi)}
.stat .n i{display:block;font-style:normal;font-size:9px;letter-spacing:.13em;color:var(--ink-3);text-transform:uppercase;margin-top:1px}
.spark{margin-top:9px;width:100%;height:34px;display:block;overflow:visible}
.spark-lab{font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-top:3px;display:flex;justify-content:space-between}

.month{display:flex;align-items:center;justify-content:space-between;margin:22px 0 12px}
.month h3{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:400}
.month button{font-family:'DM Mono',monospace;font-size:14px;color:var(--ink-3);padding:4px 9px;border:1px solid var(--rule-2);border-radius:2px}
.month button:hover{color:var(--ink);border-color:var(--ink-2)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;color:var(--ink-3);text-align:center;padding-bottom:2px}
.day{position:relative;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-family:'DM Mono',monospace;font-size:10px;color:var(--ink-3);border:1px solid var(--rule)}
.day.full{background:var(--desk);box-shadow:inset 0 2px 3px rgba(0,0,0,.9);border-color:transparent;color:transparent}
.day.part{border-color:transparent;color:var(--stock-2)}
.day.blank{border-color:transparent}
.day.tdy{outline:2px solid var(--mimeo);outline-offset:1px}
.day.noted::after{content:'';position:absolute;bottom:1px;width:3px;height:3px;border-radius:50%;background:var(--mimeo)}
.day.full.noted::after{background:var(--stock)}

.notelog{padding:12px 0;border-bottom:1px dotted var(--rule-2)}
.notelog:last-child{border-bottom:0}
.notelog .dt{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.notelog p{font-size:14.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}

/* ---------- books ---------- */
.bookstats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.bktile{background:rgba(255,255,255,.4);border:1px solid var(--rule-2);border-radius:2px;padding:14px;text-align:center}
.bktile b{display:block;font-family:'DM Mono',monospace;font-size:26px;font-weight:500;color:var(--hi)}
.bktile i{display:block;font-style:normal;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-top:4px}
.book{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px dotted var(--rule-2)}
.book:last-child{border-bottom:0}
.book .ttl{flex:1;min-width:0}
.book .ttl b{display:block;font-weight:600;font-size:14.5px;word-break:break-word}
.book .ttl span{display:block;font-family:'DM Mono',monospace;font-size:11px;color:var(--ink-3);margin-top:2px}
.book .pg{font-family:'DM Mono',monospace;font-size:12px;color:var(--ink-2);flex:none;text-align:right;white-space:nowrap}

.pnl-hd{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:0;cursor:pointer;font:inherit}
.pnl-hd .ttl{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:400;color:var(--ink-2);flex:none}
.pnl-hd .pnl-sum{flex:1;min-width:0;font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.pnl-hd .pnl-sum.warn{color:#A6322F}
.pnl-hd .chev{font-family:'DM Mono',monospace;font-size:11px;color:var(--ink-3);flex:none;width:10px;text-align:center}
.pnl-body{margin-top:12px}
.monthchart{width:100%;height:auto;display:block;overflow:visible}
.axis-lab{font-family:'DM Mono',monospace;font-size:8.5px;fill:var(--ink-3)}
.axis-title{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;fill:var(--ink-3)}
.chart-legend{display:flex;gap:16px;margin-top:8px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.chart-legend span{display:flex;align-items:center;gap:6px}
.chart-legend i{width:9px;height:9px;border-radius:2px;display:block}

/* ---------- data / sync ---------- */
.panel{border:1px solid var(--rule-2);border-radius:2px;background:rgba(255,255,255,.34);padding:16px;margin-bottom:14px}
.panel h4{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:400;color:var(--ink-2);margin-bottom:8px}
.panel p{font-size:13.5px;line-height:1.6;color:var(--ink-2);margin-bottom:12px}
.panel .er{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel input[type=text]{flex:1;min-width:180px;background:rgba(255,255,255,.72);border:1px solid var(--rule-2);border-radius:2px;padding:10px;font-family:'DM Mono',monospace;font-size:12px}
.panel input[type=text]:focus{outline:0;border-color:var(--mimeo)}
.status{font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-top:10px;display:flex;align-items:center;gap:7px}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none}
.status.live .dot{background:#2E7D4F}
.status.warn .dot{background:#A6322F}
.toggle{display:flex;align-items:center;gap:9px;margin-top:12px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.08em;color:var(--ink-2);cursor:pointer}
.toggle input{width:16px;height:16px;accent-color:var(--mimeo)}
.origin{font-family:'DM Mono',monospace;font-size:12px;background:rgba(28,33,31,.08);border:1px solid var(--rule);
  border-radius:2px;padding:9px 10px;flex:1;min-width:160px;word-break:break-all;color:var(--ink)}

/* ---------- time slots ---------- */
.slot-head{display:flex;align-items:center;gap:10px;margin:22px 0 4px;
  font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3)}
.slot-head:first-child{margin-top:4px}
.slot-head .ct{color:var(--ink-2)}
.slot-head::after{content:'';flex:1;height:1px;background:var(--rule)}

/* ---------- pass / fail controls ---------- */
.marks{display:flex;align-items:center;gap:8px;flex:none}
.miss{width:34px;height:34px;flex:none;border-radius:50%;border:1.5px solid var(--rule-2);
  color:var(--ink-3);font-size:15px;line-height:1;display:grid;place-items:center}
.miss:hover{border-color:var(--bad);color:var(--bad)}
.bad{--bad:#A6322F}

/* ---------- settled ---------- */
.settled{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dotted var(--rule-2)}
.settled:last-child{border-bottom:0}
.settled .mk{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;
  font-family:'DM Mono',monospace;font-size:11px;color:var(--stock)}
.settled .mk.y{background:var(--ink)}
.settled .mk.n{background:#A6322F}
.settled .nm{flex:1;min-width:0;font-size:14.5px;color:var(--ink-2);word-break:break-word}
.settled .nm s{text-decoration-color:var(--ink-3);opacity:.7}
.settled .val{font-family:'DM Mono',monospace;font-size:12px;color:var(--ink-3);flex:none}
.undo{font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);border:1px solid var(--rule-2);border-radius:2px;padding:5px 8px;flex:none}
.undo:hover{color:var(--ink);border-color:var(--ink-2)}

/* ---------- history ---------- */
.dayrow{border-bottom:1px dotted var(--rule-2);padding:14px 0}
.dayrow:last-of-type{border-bottom:0}
.dayrow .hd{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.dayrow .dt{flex:1;min-width:0;font-weight:600;font-size:15px}
.dayrow .dt small{display:block;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);font-weight:400;margin-top:2px}
.score{font-family:'DM Mono',monospace;font-size:13px;color:var(--ink-2);flex:none;text-align:right}
.score b{font-weight:500;color:var(--hi)}
.bar{width:54px;height:5px;border-radius:3px;background:rgba(28,33,31,.13);overflow:hidden;flex:none}
.bar i{display:block;height:100%;background:var(--mimeo)}
.dayrow .nt{font-size:14.5px;line-height:1.55;color:var(--ink-2);margin-top:9px;white-space:pre-wrap;word-break:break-word}
.dayrow .det{margin-top:11px;display:flex;flex-direction:column;gap:6px}
.dayrow .det div{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--ink-2)}
.dayrow .det span{font-family:'DM Mono',monospace;font-size:11px;width:14px;flex:none;text-align:center}
.dayrow .det .y{color:#2E7D4F}
.dayrow .det .n{color:#A6322F}
.dayrow .det .o{color:var(--ink-3)}
.pen{font-family:'DM Mono',monospace;font-size:10px;color:var(--mimeo);flex:none}

/* ---------- transfer ---------- */
.xfer{width:100%;min-height:76px;background:rgba(255,255,255,.6);border:1px solid var(--rule-2);

<script>
/* ---------------- data ---------------- */
const KEY = 'daily-card-v1';
const INKS = ['#4A3D8F','#A6322F','#17605C','#5C6B22','#23407A','#9A5A16'];
const DOW = ['S','M','T','W','T','F','S'];

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const SLOTS = [{id:'morning', label:'Morning'}, {id:'day', label:'Through the day'}, {id:'evening', label:'Evening'}];
const SLOT_IDS = SLOTS.map(s=>s.id);
const SLOT_SHORT = {morning:'AM', day:'Day', evening:'PM'};

let state = null;
let tab = 'today';
let calCursor = new Date();
let editing = null;      // {mode:'num'|'note', id, k}
let historyOpen = null;  // date key expanded in the history tab
let focusNext = null;
let saveTimer = null;
let grOpen = null;        // Goodreads panel expanded; null = auto (open until a link is saved)
let booksChartOpen = false; // monthly books/pages chart expanded
let weightRange = 90;     // days shown on the Weight chart; 0 = all time

    {id:uid(), name:'Stretch', emoji:'🤸', ink:INKS[1], days:ALL, type:'check', unit:'', goal:null, goalDir:'min', slot:'day', archived:false},
    {id:uid(), name:'Sleep', emoji:'😴', ink:INKS[2], days:ALL, type:'check', unit:'', goal:null, goalDir:'min', slot:'evening', archived:false},
    {id:uid(), name:'No junk food', emoji:'🥗', ink:INKS[3], days:ALL, type:'check', unit:'', goal:null, goalDir:'min', slot:'day', archived:false},
    {id:uid(), name:'Bed hungry', emoji:'🍽️', ink:INKS[4], days:ALL, type:'check', unit:'', goal:null, goalDir:'min', slot:'evening', archived:false},
    {id:uid(), name:'Went to bed at 1130', emoji:'🛏️', ink:INKS[5], days:ALL, type:'check', unit:'', goal:null, goalDir:'min', slot:'evening', archived:false},
    {id:uid(), name:'Weight', emoji:'⚖️', ink:INKS[0], days:ALL, type:'number', unit:'lbs', goal:null, goalDir:'min', slot:'morning', archived:false}
  ], log:{}, notes:{}, settings:{provider:'none', clientId:'', token:'', gistId:'', linked:false, auto:true, lastSync:0},
  goodreads:{url:'', items:[], lastFetch:0}, updated:Date.now()};
}

function normalize(s){
  if(!s || !Array.isArray(s.habits)) s = starter();
  if(!s.log) s.log = {};
  if(!s.notes) s.notes = {};
  if(!s.settings) s.settings = {};
  const st = s.settings;
  if(typeof st.clientId !== 'string') st.clientId = '';
  if(typeof st.token !== 'string') st.token = '';
  if(typeof st.gistId !== 'string') st.gistId = '';
  if(st.auto === undefined) st.auto = true;
  if(!st.lastSync) st.lastSync = 0;
  if(!st.provider) st.provider = st.clientId ? 'drive' : 'none';
  if(!s.goodreads || typeof s.goodreads !== 'object') s.goodreads = {};
  if(typeof s.goodreads.url !== 'string') s.goodreads.url = '';
  if(!Array.isArray(s.goodreads.items)) s.goodreads.items = [];
  if(!s.goodreads.lastFetch) s.goodreads.lastFetch = 0;
  if(!s.updated) s.updated = Date.now();
  s.habits.forEach(h=>{
    if(h.type !== 'number') h.type = 'check';
    if(typeof h.unit !== 'string') h.unit = '';
    if(h.goal === undefined) h.goal = null;
    if(h.goalDir !== 'max') h.goalDir = 'min';
    if(!SLOT_IDS.includes(h.slot)) h.slot = 'day';
    if(!Array.isArray(h.days) || !h.days.length) h.days = [0,1,2,3,4,5,6];
  });
  return s;
}

/* ---------------- dates ---------------- */
function key(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(d,n){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x; }
function today(){ const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); }
function parseKey(k){ const p=k.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
function pretty(k){ const d=parseKey(k); return DOW_FULL[d.getDay()].slice(0,3)+' '+MONTHS[d.getMonth()].slice(0,3)+' '+d.getDate(); }

/* ---------------- local storage ---------------- */
let storeOk = true;
function readLocal(){
  try{ const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; }
  catch(e){ storeOk = false; return null; }
}
function writeLocal(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ storeOk = false; toast('This browser is blocking storage, so nothing is being saved.'); }
}
async function loadState(){ return normalize(readLocal()); }

function persist(){
  state.updated = Date.now();
  dirty = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ writeLocal(); queueSync(); }, 300);
}

/* ---------------- merge (for sync + import) ---------------- */
function merge(a,b){
  if(!a) return normalize(b);
  if(!b) return normalize(a);
  const newer = (b.updated||0) >= (a.updated||0) ? b : a;
  const older = newer === a ? b : a;
  const out = {habits:[], log:{}, notes:{}, settings: a.settings || b.settings || {},
               goodreads: newer.goodreads || older.goodreads || null,
               updated: Math.max(a.updated||0, b.updated||0)};
  [older,newer].forEach(src=>{
    Object.keys(src.log||{}).forEach(k=>{ out.log[k] = Object.assign({}, out.log[k], src.log[k]); });
    Object.keys(src.notes||{}).forEach(k=>{ if(src.notes[k]) out.notes[k] = src.notes[k]; });
  });
  const seen = new Set((newer.habits||[]).map(h=>h.id));
  out.habits = (newer.habits||[]).concat((older.habits||[]).filter(h=>!seen.has(h.id)));
  return normalize(out);
}

/* ---------------- transfer code ---------------- */
function payload(){
  return {habits: state.habits, log: state.log, notes: state.notes, updated: state.updated};
}
function encodeCode(){
  const json = JSON.stringify(payload());
  const bytes = new TextEncoder().encode(json);
  let bin = '';
  bytes.forEach(b=> bin += String.fromCharCode(b));
  return 'DC1:' + btoa(bin);
}
function decodeCode(text){
  const trimmed = String(text||'').trim().replace(/\s+/g,'');
  if(!trimmed) throw new Error('Nothing to merge \u2014 paste a code first.');
  if(trimmed.slice(0,4) === 'DC1:'){
    const bin = atob(trimmed.slice(4));
    const bytes = Uint8Array.from(bin, c=>c.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes));
  }
  return JSON.parse(String(text));  // raw JSON pasted straight in
}

/* ---------------- backup file ---------------- */
function exportBackup(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'daily-card-' + key(today()) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  toast('Backup downloaded.');
}
function importBackup(file){
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const incoming = JSON.parse(r.result);
      if(!incoming || !Array.isArray(incoming.habits)) throw new Error('bad file');
      state = merge(state, incoming);
      writeLocal(); render();
      toast('Backup merged in.');
    }catch(e){ toast('That file isn\u2019t a Daily Card backup.'); }
  };
  r.onerror = ()=> toast('Could not read that file.');
  r.readAsText(file);
}

/* ---------------- google drive sync ---------------- */
const SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
const FNAME = 'daily-card.json';
let token = null, tokenExp = 0, syncing = false, syncTimer = null;
let dirty = false, lastError = '';

const cfg = () => state.settings;
const provider = () => cfg().provider || 'none';
const hasCreds = () => provider() === 'gist' ? !!cfg().token
                     : provider() === 'drive' ? !!cfg().clientId : false;
const connected = () => !!(hasCreds() && cfg().linked);

/* Strip quotes, spaces, invisible characters, and any URL wrapping that
   autolinking adds (http:// prefix, trailing slash, surrounding markup). */
function cleanId(s){
  const raw = String(s||'')
    .replace(/[\u200B-\u200D\uFEFF]/g,'')
    .replace(/["'<>\s]/g,'')
    .replace(/^https?:\/\//i,'')
    .replace(/\/+$/,'');
  const found = raw.match(/\d{6,}-[A-Za-z0-9_-]+\.apps\.googleusercontent\.com/);
  return found ? found[0] : raw;
}
const ID_RE = /^\d{6,}-[A-Za-z0-9_-]+\.apps\.googleusercontent\.com$/;

function idProblem(id){
  if(!id) return 'Paste your Google client ID first.';
  if(/^GOCSPX-/.test(id)) return 'That\u2019s the client secret. You want the client ID, just above it.';
  if(/^AIza/.test(id)) return 'That\u2019s an API key, not an OAuth client ID.';
  if(/^\d+$/.test(id)) return 'That\u2019s the project number. The client ID is longer and ends in .apps.googleusercontent.com.';
  if(!/\.apps\.googleusercontent\.com$/.test(id)) return 'A client ID always ends in .apps.googleusercontent.com — check you copied the whole thing.';
  if(!ID_RE.test(id)) return 'That doesn\u2019t look like a complete client ID. Copy it again from the Credentials page.';
  return null;
}

function loadGsi(){
  return new Promise((res,rej)=>{
    if(window.google && window.google.accounts && window.google.accounts.oauth2) return res();
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.onload = res;
    s.onerror = ()=> rej(new Error('Could not reach Google. Check your connection.'));
    document.head.appendChild(s);
  });
}
async function getToken(interactive){
  if(!cfg().clientId) throw new Error('Add your Google client ID first.');
  if(token && Date.now() < tokenExp - 60000) return token;
  await loadGsi();
  return new Promise((res,rej)=>{
    const tc = google.accounts.oauth2.initTokenClient({
      client_id: cfg().clientId.trim(),
      scope: SCOPE,
      callback: r=>{
        if(r.error) return rej(new Error(r.error_description || r.error));
        token = r.access_token;
        tokenExp = Date.now() + (Number(r.expires_in)||3600)*1000;
        res(token);
      },
      error_callback: e=> rej(new Error(e && e.type === 'popup_closed' ? 'Sign-in was closed.' : 'Google sign-in failed.'))
    });
    tc.requestAccessToken({prompt: interactive ? '' : 'none'});
  });
}
async function api(url, opts){
  const r = await fetch(url, opts);
  if(r.status === 401){ token = null; throw new Error('Google sign-in expired. Connect again.'); }
  if(!r.ok) throw new Error('Drive said no (' + r.status + ').');
  return r;
}
async function driveFind(t){
  const q = encodeURIComponent("name='" + FNAME + "' and trashed=false");
  const r = await api('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id)&q=' + q,
    {headers:{Authorization:'Bearer ' + t}});
  const j = await r.json();
  return (j.files && j.files[0]) ? j.files[0].id : null;
}
async function driveGet(t,id){
  const r = await api('https://www.googleapis.com/drive/v3/files/' + id + '?alt=media',
    {headers:{Authorization:'Bearer ' + t}});
  return r.json();
}
async function drivePut(t,id,doc){
  const body = JSON.stringify(doc);
  if(id){
    await api('https://www.googleapis.com/upload/drive/v3/files/' + id + '?uploadType=media',
      {method:'PATCH', headers:{Authorization:'Bearer ' + t,'Content-Type':'application/json'}, body});
    return id;
  }
  const b = '-------dailycard' + Date.now();
  const multi = '--' + b + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'
    + JSON.stringify({name:FNAME, parents:['appDataFolder']})
    + '\r\n--' + b + '\r\nContent-Type: application/json\r\n\r\n' + body + '\r\n--' + b + '--';
  const r = await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',
    {method:'POST', headers:{Authorization:'Bearer ' + t,'Content-Type':'multipart/related; boundary=' + b}, body:multi});
  const j = await r.json();
  return j.id;
}

/* ---------------- github gist sync ---------------- */
const GH = 'https://api.github.com';
const MARK = 'Daily Card — habit tracker data (do not rename)';

function ghHead(extra){
  const h = {Authorization:'Bearer ' + String(cfg().token||'').trim(),
             Accept:'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'};
  return extra ? Object.assign(h, extra) : h;
}
function ghErr(r){
  if(r.status === 401) return new Error('GitHub rejected that token. Check it was copied whole and hasn\u2019t expired.');
  if(r.status === 403) return new Error('GitHub refused — the token is missing the gist permission.');
  if(r.status === 404){ state.settings.gistId = ''; return new Error('The gist was missing — it will be recreated on the next sync.'); }
  return new Error('GitHub said no (' + r.status + ').');
}
async function ghFindId(){
  if(cfg().gistId) return cfg().gistId;
  const r = await fetch(GH + '/gists?per_page=100', {headers: ghHead()});
  if(!r.ok) throw ghErr(r);
  const list = await r.json();
  const hit = list.find(g=> g.description === MARK || (g.files && g.files[FNAME]));
  if(hit){ state.settings.gistId = hit.id; return hit.id; }
  return null;
}
async function ghPull(){
  const id = await ghFindId();
  if(!id) return null;
  const r = await fetch(GH + '/gists/' + id, {headers: ghHead()});
  if(!r.ok) throw ghErr(r);
  const g = await r.json();
  const f = g.files && g.files[FNAME];
  if(!f) return null;
  const text = (f.truncated && f.raw_url) ? await (await fetch(f.raw_url)).text() : f.content;
  try{ return JSON.parse(text); }catch(e){ return null; }
}
async function ghPush(doc){
  const id = cfg().gistId;
  const files = {}; files[FNAME] = {content: JSON.stringify(doc, null, 1)};
  const r = await fetch(GH + '/gists' + (id ? '/' + id : ''), {
    method: id ? 'PATCH' : 'POST',
    headers: ghHead({'Content-Type':'application/json'}),
    body: JSON.stringify({description: MARK, public: false, files: files})
  });
  if(!r.ok) throw ghErr(r);
  const g = await r.json();
  state.settings.gistId = g.id;
}

/* ---------------- drive wrappers ---------------- */
async function drivePull(interactive){
  const t = await getToken(interactive);
  const id = await driveFind(t);
  if(!id) return null;
  try{ return await driveGet(t, id); }catch(e){ return null; }
}
async function drivePush(doc, interactive){
  const t = await getToken(interactive);
  const id = await driveFind(t);
  await drivePut(t, id, doc);
}

/* Only a credential problem should disconnect. A flat tunnel, a dead wifi
   hotspot or a backgrounded phone must never silently switch sync off. */
function isAuthFailure(msg){
  return /rejected that token|missing the gist permission|sign-in|client ID|401|403/i.test(msg || '');
}

async function sync(interactive){
  const p = provider();
  if(syncing || p === 'none' || !hasCreds()) return;
  syncing = true;
  if(tab === 'data') render();
  try{
    const remote = p === 'gist' ? await ghPull() : await drivePull(interactive);
    if(remote && Array.isArray(remote.habits)) state = merge(state, remote);
    state.settings.linked = true;
    state.settings.lastSync = Date.now();
    const outgoing = Object.assign({}, state, {settings: undefined});
    if(p === 'gist') await ghPush(outgoing); else await drivePush(outgoing, interactive);
    dirty = false; lastError = '';
    writeLocal();
    syncing = false; render();
    if(interactive) toast('Synced.');
  }catch(e){
    syncing = false;
    lastError = e.message || 'Sync failed.';
    if(isAuthFailure(lastError)) state.settings.linked = false;
    writeLocal();
    if(interactive){ toast(lastError); render(); }
    else if(tab === 'data') render();
  }
}

/* Push straight away rather than waiting out the debounce — used when the
   app is about to be backgrounded or closed, which on a phone is constantly. */
function flushSync(){
  if(!dirty || !hasCreds() || !cfg().auto || syncing) return;
  clearTimeout(syncTimer);
  sync(false);
}
function queueSync(){
  if(!hasCreds() || !cfg().auto) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(()=>sync(false), 2500);
}
function disconnect(){
  state.settings.linked = false;
  token = null; tokenExp = 0;
  persist(); render();
  toast('Disconnected. Your Drive copy was left alone.');
}

/* ---------------- goodreads ---------------- */
/* Goodreads sends no CORS headers, so a browser can't read the feed directly —
   it has to go through a public read-only mirror that adds them. Two mirrors
   are tried in turn since either can be flaky or rate-limited on its own. */
const CORS_PROXIES = [
  url => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url),
  url => 'https://corsproxy.io/?url=' + encodeURIComponent(url)
];
let grFetching = false, grError = '';

async function fetchViaProxies(url){
  let lastErr;
  for(const build of CORS_PROXIES){
    try{
      const r = await fetch(build(url));
      if(!r.ok) throw new Error('status ' + r.status);
      const text = await r.text();
      if(!text || text.length < 20) throw new Error('empty response');
      return text;
    }catch(e){ lastErr = e; }
  }
  throw new Error('Could not reach Goodreads through either relay — try again in a bit. (' + (lastErr && lastErr.message) + ')');
}

function parseGoodreadsRss(text){
  const doc = new DOMParser().parseFromString(text, 'text/xml');
  if(doc.querySelector('parsererror')) throw new Error('That link didn’t come back as a feed — check it’s the RSS URL from your Goodreads shelf.');
  const tag = (el,name)=>{ const n = el.querySelector(name); return n ? n.textContent.trim() : ''; };
  const items = Array.from(doc.querySelectorAll('item')).map(it=>{
    const pages = parseInt(tag(it,'num_pages'),10);
    const readRaw = tag(it,'user_read_at');
    const read = readRaw ? new Date(readRaw) : null;
    return {
      id: tag(it,'book_id') || tag(it,'guid'),
      title: tag(it,'title'),
      author: tag(it,'author_name'),
      pages: isNaN(pages) ? null : pages,
      readAt: (read && !isNaN(read)) ? read.getTime() : null,
      link: tag(it,'link')
    };
  }).filter(b=>b.title);
  if(!items.length) throw new Error('No books came back — make sure the link is your “read” shelf RSS URL.');
  return items;
}

async function fetchGoodreads(interactive){
  if(grFetching) return;
  const input = document.getElementById('grUrl');
  const url = String((input ? input.value : state.goodreads.url) || '').trim();
  if(!url){ toast('Paste your Goodreads RSS link first.'); return; }
  state.goodreads.url = url;
  grFetching = true; grError = '';
  render();
  try{
    const text = await fetchViaProxies(url);
    const items = parseGoodreadsRss(text);
    state.goodreads.items = items;
    state.goodreads.lastFetch = Date.now();
    grFetching = false; grError = '';
    persist(); render();
    if(interactive) toast('Pulled in ' + items.length + ' books.');
  }catch(e){
    grFetching = false;
    grError = (e && e.message) || 'Refresh failed — check your connection and try again.';
    persist(); render();
  }
}

function isLeapYear(y){ return (y%4===0 && y%100!==0) || y%400===0; }

function booksThisYear(){
  const y = today().getFullYear();
  return (state.goodreads.items||[])
    .filter(b=> b.readAt && new Date(b.readAt).getFullYear() === y)
    .sort((a,b)=> b.readAt - a.readAt);
}

/* ---------------- model helpers ---------------- */
const active = () => state.habits.filter(h=>!h.archived);
const scheduled = (h,d) => h.days.includes(d.getDay());

function value(h,k){
  const v = state.log[k] ? state.log[k][h.id] : undefined;
  return v === undefined ? null : v;
}
function logged(h,k){ return value(h,k) !== null; }
function done(h,k){
  const v = value(h,k);
  if(v === null || v === false) return false;
  if(h.type !== 'number') return true;
  if(typeof v !== 'number' || isNaN(v)) return false;
  if(h.goal === null || h.goal === '') return true;
  return h.goalDir === 'max' ? v <= h.goal : v >= h.goal;
}
function setValue(h,k,v){
  if(v === null){
    if(state.log[k]){ delete state.log[k][h.id]; if(!Object.keys(state.log[k]).length) delete state.log[k]; }
  }else{
    if(!state.log[k]) state.log[k] = {};
    state.log[k][h.id] = v;
  }
  persist();
}
function toggleCheck(h,k){ setValue(h,k, done(h,k) ? null : true); }

/* An entry is "settled" once it has been marked either way — done or failed.
   Settled entries drop off today's list until you undo them. */
const settled = (h,k) => value(h,k) !== null;
const failed  = (h,k) => value(h,k) === false;
function markFail(h,k){ setValue(h,k, false); }
function unsettle(h,k){ setValue(h,k, null); }

function dayScore(d){
  const due = active().filter(h=>scheduled(h,d));
  const k = key(d);
  const won = due.filter(h=>done(h,k)).length;
  const lost = due.filter(h=>failed(h,k)).length;
  return {due:due.length, done:won, failed:lost, open:due.length - won - lost,
          pct: due.length ? Math.round(won/due.length*100) : null};
}
function bySlot(list){
  const out = {};
  SLOTS.forEach(s=> out[s.id] = []);
  list.forEach(h=> (out[h.slot] || out.day).push(h));
  return out;
}

function setNote(k,text){
  if(text && text.trim()) state.notes[k] = text;
  else delete state.notes[k];
  persist();
}
const hasNote = k => !!(state.notes[k] && state.notes[k].trim());

function streak(h){
  let n=0, d=today(), guard=0;
  const tk = key(today());
  while(guard++ < 1500){
    const k = key(d);
    if(scheduled(h,d)){
      if(done(h,k)) n++;
      else if(k !== tk) break;
    }
    d = addDays(d,-1);
  }
  return n;
}
function longest(h){
  const keys = Object.keys(state.log).sort();
  let best = streak(h);
  if(!keys.length) return best;
  let d = parseKey(keys[0]), end = today(), cur = 0, tk = key(end), guard = 0;
  while(d <= end && guard++ < 4000){
    if(scheduled(h,d)){
      if(done(h,key(d))){ cur++; if(cur>best) best=cur; }
      else if(key(d) !== tk) cur = 0;
    }
    d = addDays(d,1);
  }
  return best;
}
function rate30(h){ return rateN(h,30); }
function rate365(h){ return rateN(h,365); }
function rateN(h,n){
  let s=0, c=0;
  for(let i=n-1;i>=0;i--){
    const d = addDays(today(),-i);
    if(scheduled(h,d)){ s++; if(done(h,key(d))) c++; }
  }
  return s ? Math.round(c/s*100) : 0;
}
function series(h,n){
  const out = [];
  for(let i=n-1;i>=0;i--){
    const d = addDays(today(),-i), v = value(h,key(d));
    out.push({d, v: (typeof v === 'number' ? v : null)});
  }
  return out;
}
function dayRatio(d){
  const hs = active().filter(h=>scheduled(h,d));
  if(!hs.length) return null;
  return hs.filter(h=>done(h,key(d))).length / hs.length;
}
function fmt(n){ return typeof n === 'number' ? n.toLocaleString() : n; }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let toastTimer = null;
function toast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const el = document.createElement('div');
  el.className='toast'; el.setAttribute('role','status'); el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.remove(), 3400);
}

function goalText(h){
  if(h.goal === null || h.goal === '') return 'Log a number';
  return (h.goalDir==='max' ? 'Under ' : 'Target ')+fmt(h.goal)+(h.unit?' '+h.unit:'');
}

function todayRow(h,k){
  const s = streak(h), v = value(h,k);
  const meta = h.type === 'number' ? goalText(h)
             : (s > 0 ? '<b>' + s + ' day run</b>' : 'Open');

  const control = h.type === 'number'
    ? '<div class="numwrap"><input class="field" type="number" inputmode="decimal" step="any" '
      + 'value="' + (typeof v === 'number' ? v : '') + '" placeholder="\u2014" data-act="num" data-id="' + h.id + '" data-k="' + k + '" '
      + 'aria-label="' + esc(h.name) + '"><span class="unit">' + esc(h.unit || 'today') + '</span></div>'
    : '<button class="slot" data-act="punch" data-id="' + h.id + '" data-k="' + k + '" '
      + 'aria-label="Mark ' + esc(h.name) + ' done"></button>';

  return '<div class="row" style="--hi:' + h.ink + '">'
    + '<div class="glyph">' + esc(h.emoji || '\u2022') + '</div>'
    + '<div class="body"><div class="name">' + esc(h.name) + '</div><div class="meta">' + meta + '</div></div>'
    + '<div class="marks">'
    + '<button class="miss" data-act="fail" data-id="' + h.id + '" data-k="' + k + '" '
    + 'aria-label="Mark ' + esc(h.name) + ' missed">\u2715</button>'
    + control + '</div></div>';
}

function settledRow(h,k){
  const won = done(h,k), v = value(h,k);
  const val = (h.type === 'number' && typeof v === 'number')
    ? fmt(v) + (h.unit ? ' ' + esc(h.unit) : '') : '';
  return '<div class="settled">'
    + '<span class="mk ' + (won ? 'y' : 'n') + '">' + (won ? '\u2713' : '\u2715') + '</span>'
    + '<span class="nm">' + (won ? esc(h.name) : '<s>' + esc(h.name) + '</s>') + '</span>'
    + (val ? '<span class="val">' + val + '</span>' : '')
    + '<button class="undo" data-act="undo" data-id="' + h.id + '" data-k="' + k + '">Undo</button></div>';
}

function noteBlock(k){
  const words = (state.notes[k]||'').trim() ? (state.notes[k].trim().split(/\s+/).length + ' words') : '';
  return '<div class="note"><div class="note-head"><span>Note for the day</span><span>' + words + '</span></div>'
    + '<textarea id="dayNote" data-act="note" data-k="' + k + '" rows="3" '
    + 'placeholder="How did it go? What got in the way?">' + esc(state.notes[k]||'') + '</textarea></div>';
}

function renderToday(){
  const t = today(), k = key(t);

  if(!active().length){
    return '<div class="empty"><p>Your card is blank.<br>Add a habit to start punching holes.</p>'
      + '<div class="add" style="max-width:360px;margin:20px auto 0"><input id="quickAdd" placeholder="e.g. Walk after lunch" aria-label="New habit"><button data-act="quick">Add</button></div></div>'
      + noteBlock(k);
  }

  const due  = active().filter(h=>scheduled(h,t));
  const open = due.filter(h=>!settled(h,k));
  const shut = due.filter(h=>settled(h,k));
  const rest = active().filter(h=>!scheduled(h,t));

  let html = '';

  if(open.length){
    const groups = bySlot(open);
    SLOTS.forEach(sl=>{
      const list = groups[sl.id];
      if(!list.length) return;
      html += '<div class="slot-head">' + sl.label + ' <span class="ct">' + list.length + '</span></div>'
            + list.map(h=>todayRow(h,k)).join('');
    });
  }else if(due.length){
    const sc = dayScore(t);
    html += '<div class="empty"><p>Card complete \u2014 ' + sc.done + ' of ' + sc.due + ' punched.<br>'
          + (sc.failed ? 'Tomorrow is a fresh card.' : 'Clean sweep.') + '</p></div>';
  }else{
    html += '<div class="empty"><p>Nothing scheduled for ' + DOW_FULL[t.getDay()] + '.<br>A rest day is still a day on plan.</p></div>';
  }

  if(shut.length){
    html += '<div class="lab">Settled today \u2014 ' + dayScore(t).done + '/' + dayScore(t).due + '</div>'
          + shut.map(h=>settledRow(h,k)).join('');
  }

  if(rest.length){
    html += '<div class="lab">Not on today\u2019s card</div>'
      + rest.map(h=>'<div class="row off" style="--hi:' + h.ink + '">'
        + '<div class="glyph">' + esc(h.emoji||'\u2022') + '</div>'
        + '<div class="body"><div class="name">' + esc(h.name) + '</div>'
        + '<div class="meta">' + h.days.map(d=>DOW[d]).join(' ') + '</div></div>'
        + '<span class="slot"></span></div>').join('');
  }

  return html + noteBlock(k);
}

function renderWeek(){
  const t = today();
  const days = []; for(let i=6;i>=0;i--) days.push(addDays(t,-i));
  const hs = active();
  if(!hs.length) return '<div class="empty"><p>No habits yet — nothing to chart.</p></div>';

    + 'Tap a date at the top to write or read that day\u2019s note. A dash means the habit wasn\u2019t scheduled.</p>';
  return html;
}

/* ---------------- stats ---------------- */
function sparkline(h){
  const pts = series(h,30).map((p,i)=>({i,v:p.v})).filter(p=>p.v!==null);
  if(pts.length < 2) return '';
  const vals = pts.map(p=>p.v);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if(hi === lo){ hi = lo + 1; lo = lo - 1; }
  const W = 300, H = 30;
  const x = i => (i/29)*W;
  const y = v => H - ((v-lo)/(hi-lo))*H;
  const line = pts.map((p,n)=>(n?'L':'M')+x(p.i).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  const last = pts[pts.length-1];
  const gk = (h.goal!==null && h.goal!=='' && h.goal>=lo && h.goal<=hi)
    ? '<line x1="0" y1="'+y(h.goal).toFixed(1)+'" x2="'+W+'" y2="'+y(h.goal).toFixed(1)+'" stroke="'+h.ink+'" stroke-width="1" stroke-dasharray="3 3" opacity=".45"/>' : '';
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true">'
    + gk + '<path d="'+line+'" fill="none" stroke="'+h.ink+'" stroke-width="1.8" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>'
    + '<circle cx="'+x(last.i).toFixed(1)+'" cy="'+y(last.v).toFixed(1)+'" r="2.6" fill="'+h.ink+'" vector-effect="non-scaling-stroke"/></svg>'
    + '<div class="spark-lab"><span>30 days ago</span><span>Low '+fmt(lo)+' · High '+fmt(hi)+'</span></div>';
}

function renderStats(){
  const hs = active();
  let html = '';
  if(hs.length){
    html += '<div class="lab">Per habit</div>';
    html += hs.map(h=>{
      const nums = series(h,30).map(p=>p.v).filter(v=>v!==null);
      const avg = nums.length ? Math.round(nums.reduce((a,b)=>a+b,0)/nums.length*10)/10 : null;
      const third = h.type==='number'
        ? '<span class="n"><b>'+(avg===null?'—':fmt(avg))+'</b><i>Avg</i></span>'
        : '<span class="n"><b>'+rate30(h)+'%</b><i>30 day</i></span>';
      const fourth = h.type==='number' ? '' : '<span class="n"><b>'+rate365(h)+'%</b><i>365 day</i></span>';
      return '<div class="stat" style="--hi:'+h.ink+'"><div class="top">'
        + '<span class="nm">'+esc(h.emoji||'')+' '+esc(h.name)+'</span>'
        + '<span class="n"><b>'+streak(h)+'</b><i>Now</i></span>'
        + '<span class="n"><b>'+longest(h)+'</b><i>Best</i></span>'
        + third + fourth + '</div>'
        + (h.type==='number' ? sparkline(h) : '') + '</div>';
    }).join('');
  }

  const c = new Date(calCursor.getFullYear(), calCursor.getMonth(), 1);
  html += '<div class="month"><button data-act="cal" data-step="-1" aria-label="Previous month">&larr;</button>'
    + '<h3>'+MONTHS[c.getMonth()]+' '+c.getFullYear()+'</h3>'
    + '<button data-act="cal" data-step="1" aria-label="Next month">&rarr;</button></div>';

  html += '<div class="cal">' + DOW.map(d=>'<div class="dow">'+d+'</div>').join('');
  for(let i=0;i<c.getDay();i++) html += '<div class="day blank"></div>';
  const last = new Date(c.getFullYear(), c.getMonth()+1, 0).getDate();
  const tk = key(today());
  for(let i=1;i<=last;i++){
    const d = new Date(c.getFullYear(), c.getMonth(), i), k = key(d);
    const r = d > today() ? null : dayRatio(d);
    let cls = 'day', style = '';
    if(r === 1) cls += ' full';
    else if(r !== null && r > 0){ cls += ' part'; style = ' style="background:rgba(22,26,25,'+(0.18+r*0.6).toFixed(2)+');"'; }
    if(hasNote(k)) cls += ' noted';
    if(k === tk) cls += ' tdy';
    html += '<div class="'+cls+'"'+style+' title="'+MONTHS[c.getMonth()]+' '+i+'">'+i+'</div>';
  }
  html += '</div><p class="week-note">Darker days are fuller days. A dot marks a day with a note.</p>';

  return html;
}

/* ---------------- history ---------------- */
function historyKeys(){
  const set = {};
  Object.keys(state.log).forEach(k=> set[k] = 1);
  Object.keys(state.notes).forEach(k=>{ if(state.notes[k] && state.notes[k].trim()) set[k] = 1; });
  set[key(today())] = 1;
  return Object.keys(set).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)).sort().reverse().slice(0, 120);
}

function renderHistory(){
  const keys = historyKeys();
  const tk = key(today());
  if(keys.length <= 1 && !state.log[tk] && !hasNote(tk)){
    return '<div class="empty"><p>Nothing logged yet.<br>Days appear here once you punch or write something.</p></div>';
  }

  return keys.map(k=>{
    const d = parseKey(k), sc = dayScore(d), note = state.notes[k] || '';
    const isToday = k === tk;
    const open = historyOpen === k;
    const pct = sc.pct === null ? 0 : sc.pct;

    let head = '<button class="hd" data-act="openDay" data-k="' + k + '" aria-expanded="' + open + '">'
      + '<span class="dt">' + (isToday ? 'Today' : DOW_FULL[d.getDay()])
      + '<small>' + MONTHS[d.getMonth()].slice(0,3) + ' ' + d.getDate() + ' ' + d.getFullYear() + '</small></span>'
      + (hasNote(k) ? '<span class="pen">\u270E</span>' : '')
      + '<span class="bar"><i style="width:' + pct + '%"></i></span>'
      + '<span class="score">' + (sc.due ? '<b>' + sc.done + '</b>/' + sc.due : '\u2014') + '</span></button>';

    let body = '';
    if(note) body += '<div class="nt">' + esc(note) + '</div>';

    if(open){
      const due = active().filter(h=>scheduled(h,d));
      body += '<div class="det">' + (due.length ? due.map(h=>{
        const won = done(h,k), lost = failed(h,k), v = value(h,k);
        const cls = won ? 'y' : lost ? 'n' : 'o';
        const glyph = won ? '\u2713' : lost ? '\u2715' : '\u00B7';
        const val = (h.type === 'number' && typeof v === 'number')
          ? ' \u00B7 ' + fmt(v) + (h.unit ? ' ' + esc(h.unit) : '') : '';
        return '<div><span class="' + cls + '">' + glyph + '</span>'
          + esc(h.emoji || '') + ' ' + esc(h.name) + val + '</div>';
      }).join('') : '<div><span class="o">\u00B7</span>Nothing was scheduled</div>') + '</div>'
      + '<div class="er" style="margin-top:11px"><button class="btn" data-act="noteFor" data-k="' + k + '">'
      + (hasNote(k) ? 'Edit note' : 'Add a note') + '</button></div>'
      + (editing && editing.mode === 'note' && editing.k === k ? renderEditor() : '');
    }

    return '<div class="dayrow">' + head + body + '</div>';
  }).join('');
}

function grIsOpen(){ return grOpen === null ? !state.goodreads.url : grOpen; }

function booksMonthlyChart(){
  const y = today().getFullYear();
  const counts = new Array(12).fill(0), pages = new Array(12).fill(0);
  (state.goodreads.items||[]).forEach(b=>{
    if(!b.readAt) return;
    const d = new Date(b.readAt);
    if(d.getFullYear() !== y) return;
    counts[d.getMonth()]++;
    if(typeof b.pages === 'number') pages[d.getMonth()] += b.pages;
  });
  if(!counts.some(n=>n>0)){
    return '<div class="empty"><p>Nothing read in ' + y + ' yet.</p></div>';
  }
  const maxBooks = Math.max(1, ...counts), maxPages = Math.max(1, ...pages);
  const W = 600, H = 220, padL = 26, padR = 26, padT = 10, padB = 20;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const monW = plotW / 12, gap = monW * 0.16, barW = (monW - gap*2) / 2;

  let bars = '', labels = '';
  for(let m=0;m<12;m++){
    const x0 = padL + m*monW + gap;
    const bH1 = counts[m]/maxBooks * plotH, bH2 = pages[m]/maxPages * plotH;
    const y1 = padT + plotH - bH1, y2 = padT + plotH - bH2;
    bars += '<rect x="' + x0.toFixed(1) + '" y="' + y1.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + bH1.toFixed(1) + '" fill="var(--mimeo)" rx="1">'
      + '<title>' + MONTHS[m] + ': ' + counts[m] + ' book' + (counts[m]===1?'':'s') + '</title></rect>';
    bars += '<rect x="' + (x0+barW).toFixed(1) + '" y="' + y2.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + bH2.toFixed(1) + '" fill="#9A5A16" rx="1">'
      + '<title>' + MONTHS[m] + ': ' + fmt(pages[m]) + ' pages</title></rect>';
    labels += '<text x="' + (padL + m*monW + monW/2).toFixed(1) + '" y="' + (H-6) + '" text-anchor="middle" class="axis-lab">' + MONTHS[m].slice(0,1) + '</text>';
  }
  const base = '<line x1="' + padL + '" y1="' + (padT+plotH) + '" x2="' + (W-padR) + '" y2="' + (padT+plotH) + '" stroke="var(--rule-2)" stroke-width="1"/>';
  const scaleLabs = '<text x="' + padL + '" y="' + (padT+8) + '" text-anchor="start" class="axis-lab">' + maxBooks + ' bks</text>'
    + '<text x="' + (W-padR) + '" y="' + (padT+8) + '" text-anchor="end" class="axis-lab">' + fmt(maxPages) + ' pg</text>';

  return '<svg class="monthchart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Books and pages read by month, ' + y + '">'
    + base + scaleLabs + bars + labels + '</svg>'
    + '<div class="chart-legend"><span><i style="background:var(--mimeo)"></i>Books</span><span><i style="background:#9A5A16"></i>Pages</span></div>';
}

/* Round a raw axis step up to a "nice" 1/2/5x10^n so gridlines land on
   sensible values instead of arbitrary fractions. */
function niceStep(range, targetTicks){
  targetTicks = targetTicks || 5;
  if(!(range > 0)) range = 1;
  const rough = range / targetTicks;
  const mag = Math.pow(10, Math.floor(Math.log10(rough)));
  const norm = rough / mag;
  const step = norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10;
  return step * mag;
}

function weightChart(h, pts){
  const W = 600, H = 280, padL = 48, padR = 16, padT = 16, padB = 46;
  const plotW = W - padL - padR, plotH = H - padT - padB;

  const vals = pts.map(p=>p.v);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if(lo === hi){ lo -= 1; hi += 1; }
  const step = niceStep(hi - lo, 5);
  const niceLo = Math.floor(lo/step)*step, niceHi = Math.ceil(hi/step)*step;
  const vRange = (niceHi - niceLo) || 1;

  const t0 = pts[0].d.getTime(), t1 = pts[pts.length-1].d.getTime();
  const tSpan = Math.max(1, t1 - t0);
  const x = d => padL + ((d.getTime()-t0)/tSpan) * plotW;
  const y = v => padT + plotH - ((v-niceLo)/vRange) * plotH;

  let gridY = '', yLabs = '';
  const ticksY = Math.round(vRange/step);
  for(let i=0;i<=ticksY;i++){
    const v = niceLo + i*step, yy = y(v);
    gridY += '<line x1="'+padL+'" y1="'+yy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+yy.toFixed(1)+'" stroke="var(--rule)" stroke-width="1"/>';
    yLabs += '<text x="'+(padL-8)+'" y="'+(yy+3).toFixed(1)+'" text-anchor="end" class="axis-lab">'+fmt(Math.round(v*100)/100)+'</text>';
  }

  const ticksX = Math.max(1, Math.min(6, pts.length));
  const showYear = tSpan > 300*86400000;
  let xLabs = '';
  for(let i=0;i<ticksX;i++){
    const frac = ticksX===1 ? 0 : i/(ticksX-1);
    const dd = new Date(t0 + frac*tSpan);
    const xx = padL + frac*plotW;
    const lab = MONTHS[dd.getMonth()].slice(0,3)+' '+dd.getDate()+(showYear ? " '"+String(dd.getFullYear()).slice(2) : '');
    xLabs += '<text x="'+xx.toFixed(1)+'" y="'+(padT+plotH+16)+'" text-anchor="middle" class="axis-lab">'+lab+'</text>';
  }

  const line = pts.map((p,i)=>(i?'L':'M')+x(p.d).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  const dots = pts.map(p=>'<circle cx="'+x(p.d).toFixed(1)+'" cy="'+y(p.v).toFixed(1)+'" r="2.4" fill="'+h.ink+'"><title>'
    + pretty(p.k)+': '+fmt(p.v)+(h.unit?' '+esc(h.unit):'')+'</title></circle>').join('');

  const axisBase = '<line x1="'+padL+'" y1="'+(padT+plotH)+'" x2="'+(W-padR)+'" y2="'+(padT+plotH)+'" stroke="var(--rule-2)" stroke-width="1"/>';
  const xTitle = '<text x="'+(padL+plotW/2)+'" y="'+(H-6)+'" text-anchor="middle" class="axis-title">Date</text>';
  const yTitle = '<text x="12" y="'+(padT+plotH/2)+'" text-anchor="middle" class="axis-title" transform="rotate(-90 12 '+(padT+plotH/2)+')">Weight'
    + (h.unit ? ' ('+esc(h.unit)+')' : '') + '</text>';

  return '<svg class="monthchart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Weight over time, in '+esc(h.unit||'units')+'">'
    + gridY + axisBase + yLabs + xLabs + xTitle + yTitle
    + '<path d="'+line+'" fill="none" stroke="'+h.ink+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>'
    + dots + '</svg>';
}

function renderWeight(){
  const h = weightHabit();
  if(!h) return '<div class="empty"><p>No weight habit found.<br>Add a number habit named “Weight” on the Habits tab to see it graphed here.</p></div>';

  const allPts = weightPoints(h);
  if(!allPts.length) return '<div class="empty"><p>No weight logged yet.<br>Log a value from Today or Week to see your trend here.</p></div>';

  const ranges = [{d:30,l:'1M'},{d:90,l:'3M'},{d:365,l:'1Y'},{d:0,l:'All'}];
  const cutoff = weightRange ? addDays(today(), -weightRange) : null;
  const pts = cutoff ? allPts.filter(p=>p.d>=cutoff) : allPts;

  let html = '<div class="seg" style="margin-bottom:14px">' + ranges.map(r=>
    '<button data-act="wRange" data-range="'+r.d+'" aria-pressed="'+(weightRange===r.d)+'">'+r.l+'</button>').join('') + '</div>';

  if(!pts.length){
    return html + '<div class="empty"><p>Nothing logged in this range.<br>Try a wider range.</p></div>';
  }
  if(pts.length < 2){
    const only = pts[0];
    html += '<div class="bookstats"><div class="bktile" style="--hi:'+h.ink+'"><b>'+fmt(only.v)+'</b><i>Current'+(h.unit?' ('+esc(h.unit)+')':'')+'</i></div></div>'
      + '<div class="empty"><p>Only one entry in this range — log another day or widen the range to see a trend.</p></div>';
    return html;
  }

  const vals = pts.map(p=>p.v);
  const latest = pts[pts.length-1].v, first = pts[0].v;
  const change = Math.round((latest-first)*100)/100;
  const lo = Math.min(...vals), hiv = Math.max(...vals);

  html += '<div class="bookstats">'
    + '<div class="bktile" style="--hi:'+h.ink+'"><b>'+fmt(latest)+'</b><i>Current'+(h.unit?' ('+esc(h.unit)+')':'')+'</i></div>'
    + '<div class="bktile" style="--hi:'+h.ink+'"><b>'+(change>0?'+':'')+fmt(change)+'</b><i>Change, this range</i></div>'
    + '<div class="bktile" style="--hi:'+h.ink+'"><b>'+fmt(lo)+'</b><i>Low</i></div>'
    + '<div class="bktile" style="--hi:'+h.ink+'"><b>'+fmt(hiv)+'</b><i>High</i></div>'
    + '</div>'
    + weightChart(h, pts);

  return html;
}

function renderBooks(){

  const list = booksThisYear();
  const withPages = list.filter(b=>typeof b.pages === 'number');

  const avgPages = withPages.length ? Math.round(totalPages/withPages.length) : null;

  const dayOfYear = Math.floor((today()-start)/86400000) + 1;
  const diy = isLeapYear(y) ? 366 : 365;
  const projBooks = list.length ? Math.round(list.length / dayOfYear * diy) : 0;
  const projPages = totalPages ? Math.round(totalPages / dayOfYear * diy) : 0;

      + 'value="' + esc(g.url||'') + '" spellcheck="false" aria-label="Goodreads RSS URL">'
      + '<button class="btn solid" data-act="grRefresh"' + (grFetching?' disabled':'') + '>'
      + (grFetching ? 'Refreshing…' : 'Refresh') + '</button></div>'
      + '<div class="' + statusCls + '"><span class="dot"></span>' + esc(statusTxt) + '</div>'
      + '</div>';
  }

    + '<div class="bktile"><b>' + fmt(totalPages) + '</b><i>Pages in ' + y + '</i></div>'
    + '<div class="bktile"><b>' + fmt(projBooks) + '</b><i>Projected books</i></div>'
    + '<div class="bktile"><b>' + fmt(projPages) + '</b><i>Projected pages</i></div>'
    + '</div>'
    + '<p class="week-note">Day ' + dayOfYear + ' of ' + diy + ' — at this pace, ' + y + ' finishes around <b>' + fmt(projBooks) + '</b> book'
    + (projBooks===1?'':'s') + (totalPages ? ' and roughly <b>' + fmt(projPages) + '</b> pages' : '')
    + (avgPages===null ? '' : ' (averaging <b>' + fmt(avgPages) + '</b> pages/book)') + '.</p>';

  html += '<div class="panel">'
    + '<button class="pnl-hd" data-act="chartToggle" aria-expanded="' + booksChartOpen + '">'

  const rest = g.items.length - list.length;
  if(rest > 0) html += '<p class="week-note">' + fmt(rest) + ' more book' + (rest===1?'':'s') + ' from other years in the last pull '
    + '— Goodreads’ RSS only returns your most recent shelf activity.</p>';

  return html;
}

      + 'Create a token at <b>github.com/settings/tokens</b> with only the <b>gist</b> box ticked, then paste it here. '
      + 'No project setup, no origins, no approval screens.</p>'
      + '<div class="er"><input type="text" id="ghToken" placeholder="ghp_… or github_pat_…" value="' + esc(s.token||'') + '" spellcheck="false" aria-label="GitHub token">'
      + actions + '</div>'
      + '<label class="toggle"><input type="checkbox" data-act="auto"' + (s.auto ? ' checked' : '') + '>Sync automatically after changes</label>'
      + '<p style="margin:14px 0 0;font-size:12.5px">The token is stored in this browser, so give it the gist permission and nothing else. '
      + 'You can revoke it from GitHub at any time, and paste the same one on your other devices.</p>';
  }else if(p === 'drive'){
    body = '<p>Keeps your card in a private folder in your own Google Drive. Needs a client ID from a Google Cloud project — the fiddlier of the two options.</p>'
      + '<div class="er"><input type="text" id="clientId" placeholder="xxxxx.apps.googleusercontent.com" value="' + esc(s.clientId||'') + '" spellcheck="false" aria-label="Google client ID">'
      + actions + '</div>'
      + '<label class="toggle"><input type="checkbox" data-act="auto"' + (s.auto ? ' checked' : '') + '>Sync automatically after changes</label>'
      + '<p style="margin:14px 0 0;font-size:12.5px">This exact address must be listed under <b>Authorized JavaScript origins</b> — no trailing slash, no page path:</p>'
      + '<div class="er" style="margin-top:8px"><code class="origin">' + esc(location.origin) + '</code>'
      + '<button class="btn" data-act="copyOrigin">Copy</button></div>';
  }else{
    body = '<p>This card lives only in this browser. Turn on GitHub sync to keep your phone and laptop in step — it takes about a minute and needs nothing but a token.</p>';
  }

  return '<div class="panel"><h4>This device</h4>'
    + '<p>' + days + ' day' + (days===1?'':'s') + ' logged · ' + notes + ' note' + (notes===1?'':'s') + ' written. '
    + (storeOk ? 'Saved in this browser.' : 'This browser is blocking storage — nothing is being saved.') + '</p>'
    + '<div class="er"><button class="btn solid" data-act="export">Download backup</button>'
    + '<button class="btn" data-act="pickImport">Restore from file</button>'
    + (navigator.share ? '<button class="btn" data-act="share">Send elsewhere</button>' : '')
    + '<input type="file" id="importFile" accept="application/json,.json" hidden></div>'
    + '<p style="margin:12px 0 0;font-size:12.5px">A backup is a single JSON file. Keep it in Drive, iCloud, Files, or an email to yourself — restoring merges it back in without wiping what\u2019s already here.</p></div>'

    + '<div class="panel"><h4>Hand off to another device</h4>'
    + '<p>No accounts, no setup. Copy this device\u2019s code, send it to yourself however you like, then paste it into this box on the other device and merge.</p>'
    + '<div class="er"><button class="btn" data-act="copyCode">Copy this device\u2019s code</button>'
    + '<button class="btn solid" data-act="pasteCode">Merge pasted code</button></div>'
    + '<textarea class="xfer" id="xfer" placeholder="Paste a transfer code here" spellcheck="false" aria-label="Transfer code"></textarea></div>'

    + '<div class="panel"><h4>Sync across devices</h4>'
    + '<div class="seg" style="margin-bottom:12px">'
    + '<button data-act="prov" data-p="none" aria-pressed="' + (p==='none') + '">Off</button>'
    + '<button data-act="prov" data-p="gist" aria-pressed="' + (p==='gist') + '">GitHub</button>'
    + '<button data-act="prov" data-p="drive" aria-pressed="' + (p==='drive') + '">Drive</button></div>'
    + body
    + '<div class="' + statusCls + '"><span class="dot"></span>' + esc(statusTxt) + '</div>'
    + (p !== 'none' ? '<p style="margin:10px 0 0;font-size:12px;color:var(--ink-3)">'
        + 'This device last pushed ' + (s.lastSync ? new Date(s.lastSync).toLocaleString() : 'never')
        + (s.gistId ? ' \u00B7 gist ' + esc(String(s.gistId).slice(0,8)) + '\u2026' : ' \u00B7 no gist yet')
        + '</p>' : '')
    + '</div>'

    + '<div class="panel"><h4>If two devices disagree</h4>'
    + '<p>Nothing is thrown away. Days and notes from both devices are combined, and whichever device saved most recently wins any direct clash on the same entry. Your habit list comes from the most recently edited device.</p></div>';
}

function grow(el){ if(!el) return; el.style.height='auto'; el.style.height=(el.scrollHeight+2)+'px'; }

function render(){
  renderMast();
  const v = document.getElementById('view');
  v.innerHTML = tab==='today' ? renderToday()
              : tab==='week'  ? renderWeek()
              : tab==='history' ? renderHistory()
              : tab==='stats' ? renderStats()
              : tab==='weight' ? renderWeight()
              : tab==='books' ? renderBooks()
              : tab==='data'  ? renderData()
              : renderEdit();
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected', String(b.dataset.tab===tab)));
  grow(document.getElementById('dayNote'));
  if(focusNext){ const el = document.getElementById(focusNext); if(el){ el.focus(); if(el.select) el.select(); } focusNext = null; }
}

/* ---------------- events ---------------- */
document.querySelector('.tabs').addEventListener('click', e=>{
  const b = e.target.closest('.tab'); if(!b) return;
  tab = b.dataset.tab; editing = null; render();
});

function addHabit(name){
  name = (name||'').trim();
  if(!name){ toast('Give the habit a name first.'); return; }
  state.habits.push({id:uid(), name, emoji:'', ink:INKS[state.habits.length % INKS.length],
    days:[0,1,2,3,4,5,6], type:'check', unit:'', goal:null, goalDir:'min', slot:'day', archived:false});
  persist(); render();
}

const view = document.getElementById('view');

view.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b || b.tagName === 'INPUT' || b.tagName === 'TEXTAREA' || b.tagName === 'SELECT') return;
  const act = b.dataset.act;
  const h = state.habits.find(x=>x.id===b.dataset.id);

  if(act==='punch'){
    const wasOn = b.classList.contains('on');
    toggleCheck(h, b.dataset.k);
    if(!wasOn && b.classList.contains('slot')){
      const chad = document.createElement('span'); chad.className='chad';
      b.appendChild(chad); setTimeout(()=>chad.remove(),520);
      b.classList.add('on'); b.setAttribute('aria-pressed','true');
      renderMast(); setTimeout(render,190); return;
    }
    render(); return;
  }
  if(act==='fail'){
    markFail(h, b.dataset.k);
    render(); return;
  }
  if(act==='undo'){
    unsettle(h, b.dataset.k);
    render(); return;
  }
  if(act==='openDay'){
    historyOpen = historyOpen === b.dataset.k ? null : b.dataset.k;
    editing = null; render(); return;
  }
  if(act==='editNum'){
    editing = {mode:'num', id:h.id, k:b.dataset.k};
    focusNext = 'edNum'; render(); return;
  }
  if(act==='noteFor'){
    const k = b.dataset.k;
    editing = (editing && editing.mode==='note' && editing.k===k) ? null : {mode:'note', k};
    if(editing) focusNext = 'edNote';
    render(); return;
  }
  if(act==='saveNum'){
    const raw = document.getElementById('edNum').value.trim();
    const hh = state.habits.find(x=>x.id===editing.id);
    setValue(hh, editing.k, raw==='' ? null : Number(raw));
    editing = null; render(); return;
  }
  if(act==='clearNum'){
    const hh = state.habits.find(x=>x.id===editing.id);
    setValue(hh, editing.k, null); editing = null; render(); return;
  }
  if(act==='saveNote'){
    setNote(editing.k, document.getElementById('edNote').value);
    editing = null; render(); toast('Note saved.'); return;
  }
  if(act==='closeEd'){ editing = null; render(); return; }
  if(act==='type'){
    h.type = b.dataset.type;
    persist(); render(); return;
  }
  if(act==='slot'){ h.slot = b.dataset.slot; persist(); render(); return; }
  if(act==='ink'){ h.ink = b.dataset.ink; persist(); render(); return; }
  if(act==='day'){
    const d = Number(b.dataset.day);
    h.days = h.days.includes(d) ? h.days.filter(x=>x!==d) : h.days.concat(d).sort();
    if(!h.days.length){ h.days=[d]; toast('A habit needs at least one day.'); }
    persist(); render(); return;
  }
  if(act==='move'){
    const step = Number(b.dataset.step), i = state.habits.indexOf(h), j = i+step;
    if(j<0 || j>=state.habits.length) return;
    state.habits.splice(j,0,state.habits.splice(i,1)[0]);
    persist(); render(); return;
  }
  if(act==='archive'){ h.archived = true; persist(); render(); toast('Archived. Its history is kept.'); return; }
  if(act==='restore'){ h.archived = false; persist(); render(); return; }
  if(act==='delete'){
    state.habits = state.habits.filter(x=>x.id!==h.id);
    Object.keys(state.log).forEach(k=>{ delete state.log[k][h.id]; if(!Object.keys(state.log[k]).length) delete state.log[k]; });
    persist(); render(); toast('Deleted for good.'); return;
  }
  if(act==='cal'){ calCursor.setMonth(calCursor.getMonth()+Number(b.dataset.step)); render(); return; }
  if(act==='export'){ exportBackup(); return; }
  if(act==='copyCode'){
    const code = encodeCode();
    const box = document.getElementById('xfer');
    if(box) box.value = code;
    if(navigator.clipboard){
      navigator.clipboard.writeText(code)
        .then(()=>toast('Copied \u2014 paste it on the other device.'))
        .catch(()=>toast('Copy it from the box below.'));
    }else{
      if(box){ box.focus(); box.select(); }
      toast('Copy it from the box below.');
    }
    return;
  }
  if(act==='pasteCode'){
    try{
      const incoming = decodeCode(document.getElementById('xfer').value);
      if(!incoming || !Array.isArray(incoming.habits)) throw new Error('bad');
      state = merge(state, incoming);
      writeLocal(); render();
      toast('Merged in.');
    }catch(e){ toast(e.message && e.message.indexOf('paste') > -1 ? e.message : 'That code didn\u2019t read as a Daily Card backup.'); }
    return;
  }
  if(act==='share'){
    const text = JSON.stringify(payload(), null, 1);
    const name = 'daily-card-' + key(today()) + '.json';
    const file = (window.File && navigator.canShare)
      ? new File([text], name, {type:'application/json'}) : null;
    if(file && navigator.canShare({files:[file]})){
      navigator.share({files:[file], title:'Daily Card backup'}).catch(()=>{});
    }else{
      navigator.share({title:'Daily Card backup', text: encodeCode()}).catch(()=>{});
    }
    return;
  }
  if(act==='pickImport'){ document.getElementById('importFile').click(); return; }
  if(act==='prov'){
    state.settings.provider = b.dataset.p;
    state.settings.linked = false;
    persist(); render(); return;
  }
  if(act==='connect'){
    if(provider() === 'gist'){
      const t = String(document.getElementById('ghToken').value||'').replace(/[\s"'<>]/g,'');
      if(!t){ toast('Paste your GitHub token first.'); return; }
      if(!/^(ghp_|gho_|github_pat_)/.test(t)){ toast('GitHub tokens start with ghp_ or github_pat_.'); return; }
      state.settings.token = t; writeLocal(); render();
      sync(true); return;
    }
    const id = cleanId(document.getElementById('clientId').value);
    const problem = idProblem(id);
    if(problem){ toast(problem); return; }
    state.settings.clientId = id; writeLocal(); render();
    sync(true); return;
  }
  if(act==='copyOrigin'){
    const o = location.origin;
    if(navigator.clipboard) navigator.clipboard.writeText(o).then(()=>toast('Copied ' + o), ()=>toast(o));
    else toast(o);
    return;
  }
  if(act==='disconnect'){ disconnect(); return; }
  if(act==='grRefresh'){ fetchGoodreads(true); return; }
  if(act==='grToggle'){ grOpen = !grIsOpen(); render(); return; }
  if(act==='chartToggle'){ booksChartOpen = !booksChartOpen; render(); return; }
  if(act==='wRange'){ weightRange = Number(b.dataset.range); render(); return; }
  if(act==='add'){ addHabit(document.getElementById('newHabit').value); return; }
  if(act==='quick'){ addHabit(document.getElementById('quickAdd').value); return; }
});

view.addEventListener('input', e=>{
  const el = e.target, act = el.dataset.act;
  if(!act) return;
  const h = state.habits.find(x=>x.id===el.dataset.id);

  if(act==='name'){ h.name = el.value; persist(); return; }
  if(act==='emoji'){ h.emoji = el.value; persist(); return; }
  if(act==='unit'){ h.unit = el.value; persist(); return; }
  if(act==='goal'){ h.goal = el.value==='' ? null : Number(el.value); persist(); return; }
  if(act==='note'){ setNote(el.dataset.k, el.value); grow(el); return; }
  if(act==='num'){
    const raw = el.value.trim();
    setValue(h, el.dataset.k, raw==='' ? null : Number(raw));
    el.classList.toggle('met', done(h, el.dataset.k));
    renderMast();
    return;
  }
});

view.addEventListener('change', e=>{
  const el = e.target;
  if(el.id === 'importFile'){
    if(el.files && el.files[0]) importBackup(el.files[0]);
    el.value = ''; return;
  }
  if(el.dataset.act === 'auto'){
    state.settings.auto = el.checked; persist();
    toast(el.checked ? 'Auto-sync on.' : 'Auto-sync off — use Sync now.');
    return;
  }
  if(el.dataset.act === 'goalDir'){
    const h = state.habits.find(x=>x.id===el.dataset.id);
    if(el.value === 'none'){ h.goal = null; }
    else { h.goalDir = el.value; if(h.goal === null) h.goal = 0; }
    persist(); render();
  }
});

view.addEventListener('focusout', e=>{
  if(e.target.dataset && e.target.dataset.act === 'num') render();
}, true);

view.addEventListener('keydown', e=>{
  if(e.key === 'Escape' && editing){ editing = null; render(); return; }
  if(e.key !== 'Enter') return;
  if(e.target.id === 'newHabit'){ addHabit(e.target.value); focusNext='newHabit'; }
  else if(e.target.id === 'quickAdd'){ addHabit(e.target.value); }
  else if(e.target.id === 'edNum'){ document.querySelector('[data-act="saveNum"]').click(); }
  else if(e.target.classList.contains('name-in') || e.target.dataset.act === 'num'){ e.target.blur(); }
});

document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && !editing) render(); });

/* ---------------- boot ---------------- */
(async function(){
  state = await loadState();
  writeLocal();
  render();
  if(!storeOk) toast('This browser is blocking storage, so nothing will be saved.');

  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  }
  if(hasCreds()) sync(false);

  let awayAt = Date.now();
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden){ awayAt = Date.now(); flushSync(); return; }
    if(!hasCreds()) return;
    if(dirty || Date.now() - awayAt > 45000) sync(false);
  });
  window.addEventListener('pagehide', flushSync);
  window.addEventListener('blur', flushSync);
  window.addEventListener('online', ()=>{ if(hasCreds()) sync(false); });
})();
</script>
</body>
</html>
